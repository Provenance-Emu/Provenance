name: Generate Licenses

on:
  push:
    branches: [develop, master]
    paths:
      - 'Cores/**/Core.plist'
      - 'CoresRetro/**/Core.plist'
      - 'Scripts/generate_licenses.py'
      - 'Provenance.xcworkspace/xcshareddata/swiftpm/Package.resolved'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate license manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run license generator
        run: |
          python3 Scripts/generate_licenses.py
          echo "Generated LICENSES.md and Scripts/licenses.json"

      - name: Check for missing license data
        run: |
          python3 Scripts/generate_licenses.py --check || true

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet LICENSES.md Scripts/licenses.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No license changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated license files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LICENSES.md Scripts/licenses.json
          git commit -m "chore: auto-update license manifest

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push

      - name: Post summary
        if: always()
        run: |
          echo "## License Manifest" >> "$GITHUB_STEP_SUMMARY"
          if [ -f Scripts/licenses.json ]; then
            TOTAL=$(python3 -c "import json; print(len(json.load(open('Scripts/licenses.json'))['cores']))")
            MISSING=$(python3 Scripts/generate_licenses.py --check 2>&1 | grep -c "missing" || echo "0")
            echo "- **Total entries**: $TOTAL" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Missing license data**: $MISSING" >> "$GITHUB_STEP_SUMMARY"
          fi
