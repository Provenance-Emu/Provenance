name: Generate Licenses

on:
  push:
    branches: [develop, master]
    paths:
      - 'Cores/**/Core.plist'
      - 'CoresRetro/**/Core.plist'
      - 'Scripts/generators/generate_licenses.py'
      - 'Provenance.xcworkspace/xcshareddata/swiftpm/Package.resolved'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate license manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run license generator
        run: |
          python3 Scripts/generators/generate_licenses.py
          echo "Generated LICENSES.md and Scripts/generators/licenses.json"

      - name: Check for missing license data
        run: |
          python3 Scripts/generators/generate_licenses.py --check || true

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet LICENSES.md Scripts/generators/licenses.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No license changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # develop is protected (PR + code-owner review required), so a direct push is
      # rejected with GH006. Try it first (works on unprotected branches); otherwise
      # fall back to one rolling PR per branch instead of failing the job.
      - name: Commit updated license files
        id: commit
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LICENSES.md Scripts/generators/licenses.json
          git commit -m "chore: auto-update license manifest

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          if git push; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            BRANCH="chore/license-manifest-${GITHUB_REF_NAME}"
            echo "Direct push rejected; updating PR branch ${BRANCH}"
            git fetch origin "$BRANCH" 2>/dev/null || true
            git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
            OPEN=$(gh pr list --head "$BRANCH" --base "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
            if [ -z "$OPEN" ]; then
              gh pr create --head "$BRANCH" --base "$GITHUB_REF_NAME" \
                --title "chore: auto-update license manifest" \
                --body "Regenerated by the Generate Licenses workflow. ${GITHUB_REF_NAME} is protected, so the bot cannot push directly; merging this updates LICENSES.md and Scripts/generators/licenses.json."
            else
              echo "PR #${OPEN} already open; branch updated"
            fi
          fi

      - name: Dispatch website sync
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Provenance-EMU/provenance-emu.github.io/dispatches \
            -d "{\"event_type\":\"licenses-updated\",\"client_payload\":{\"ref\":\"${{ github.ref_name }}\"}}"
          echo "Dispatched licenses-updated to provenance-emu.github.io"

      - name: Dispatch wiki sync
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Provenance-Emu/wiki/dispatches \
            -d "{\"event_type\":\"licenses-updated\",\"client_payload\":{\"ref\":\"${{ github.ref_name }}\"}}"
          echo "Dispatched licenses-updated to wiki"

      - name: Post summary
        if: always()
        run: |
          echo "## License Manifest" >> "$GITHUB_STEP_SUMMARY"
          if [ -f Scripts/generators/licenses.json ]; then
            TOTAL=$(python3 -c "import json; print(len(json.load(open('Scripts/generators/licenses.json'))['entries']))")
            MISSING=$(python3 Scripts/generators/generate_licenses.py --check 2>&1 | grep -c "missing" || echo "0")
            echo "- **Total entries**: $TOTAL" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Missing license data**: $MISSING" >> "$GITHUB_STEP_SUMMARY"
          fi
