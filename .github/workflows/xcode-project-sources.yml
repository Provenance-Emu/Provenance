name: Xcode Project Sources

# Most workspace projects list their sources explicitly, so a new source file
# that SwiftPM picks up can still be missing from the Xcode archive build — and
# the full archive build does not run on agent or owner PRs. This catches that
# in seconds: see Scripts/audits/check_pbxproj_sources.py.

on:
  push:
    branches: [develop, master]
    paths:
      - '**.swift'
      - '**.m'
      - '**.mm'
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.pbxproj'
      - 'Provenance.xcworkspace/**'
      - 'Scripts/audits/check_pbxproj_sources.py'
      - 'Scripts/tests/test_check_pbxproj_sources.py'
      - 'Scripts/tests/**'
      - 'Scripts/ci/ci-core-manifest.py'
      - 'Scripts/dev/*.rb'
      - '**/Core.plist'
      - 'Scripts/audits/pbxproj_sources_allowlist.txt'
      - 'Scripts/audits/check_shipping_vs_dev.py'
      - 'Tuist/ProjectDescriptionHelpers/CoreProduct.swift'
      - '.github/workflows/xcode-project-sources.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - '**.swift'
      - '**.m'
      - '**.mm'
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.pbxproj'
      - 'Provenance.xcworkspace/**'
      - 'Scripts/audits/check_pbxproj_sources.py'
      - 'Scripts/tests/test_check_pbxproj_sources.py'
      - 'Scripts/tests/**'
      - 'Scripts/ci/ci-core-manifest.py'
      - 'Scripts/dev/*.rb'
      - '**/Core.plist'
      - 'Scripts/audits/pbxproj_sources_allowlist.txt'
      - 'Scripts/audits/check_shipping_vs_dev.py'
      - 'Tuist/ProjectDescriptionHelpers/CoreProduct.swift'
      - '.github/workflows/xcode-project-sources.yml'
  workflow_dispatch:

jobs:
  check:
    name: Unreferenced source files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the checker
        run: python3 Scripts/tests/test_check_pbxproj_sources.py

      - name: Check Xcode projects reference their sources
        run: python3 Scripts/audits/check_pbxproj_sources.py

      # The shipping pbxproj and the Tuist dev workspace must link the same core
      # packages until the shipping project is generated too (dedup design, phase 2).
      - name: Shipping project vs dev core rows
        run: |
          python3 Scripts/tests/test_check_shipping_vs_dev.py
          python3 Scripts/audits/check_shipping_vs_dev.py

      # Core packaging guards: manifest parsing, package module/resource-bundle naming, the
      # CI-target core patterns, and the swap script (skips without the xcodeproj gem + plutil).
      - name: Core packaging tests
        run: |
          for t in test_ci_core_manifest test_core_package_modules test_create_ci_target_patterns test_swap_core_to_package; do
            python3 -m unittest -v "Scripts/tests/$t.py"
          done
