name: Agent Validation

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PRD_TEMPLATE.md'

concurrency:
  group: agent-validation-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Fast lint on ubuntu (~1 min)
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Get changed Swift files
        id: changed
        run: |
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep '\.swift$' || true)
          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$FILES" > changed_files.txt
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install SwiftLint
        if: steps.changed.outputs.skip == 'false'
        run: |
          SWIFTLINT_VERSION="0.54.0"
          curl -sL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux.zip" -o swiftlint.zip
          unzip -q swiftlint.zip -d swiftlint
          chmod +x swiftlint/swiftlint
          sudo mv swiftlint/swiftlint /usr/local/bin/

      - name: Run SwiftLint on changed files
        if: steps.changed.outputs.skip == 'false'
        run: |
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              swiftlint lint --path "$file" --config .swiftlint.yml --reporter github-actions-logging || true
            fi
          done < changed_files.txt

  # Job 2: SPM Build/Test for leaf modules (~5-10 min)
  spm-test:
    name: SPM Test (${{ matrix.module }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - PVLogging
          - PVSettings
          - PVHashing
          - PVPlists
          - PVFeatureFlags
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Check if module changed
        id: check
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep -c "^${{ matrix.module }}/" || true)
          if [ "$CHANGED" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Select Xcode
        if: steps.check.outputs.changed == 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build module
        if: steps.check.outputs.changed == 'true'
        run: |
          cd ${{ matrix.module }}
          swift build 2>&1 | tail -20

      - name: Test module
        if: steps.check.outputs.changed == 'true'
        run: |
          cd ${{ matrix.module }}
          swift test 2>&1 | tail -40

  # Job 3: Fast CI simulator build — validates that code compiles
  # Uses Provenance-CI target (no emulator cores) for fastest possible build
  smoke-build:
    name: Build (Provenance-CI Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      # These four Core dirs are top-level git submodules, so they are empty
      # when submodules: false is set. xcodebuild resolves ALL XCLocalSwiftPackageReference
      # entries in the workspace (not just those in the CI scheme), so their Package.swift
      # files must exist. Shallow-init only these four — everything else has Package.swift
      # tracked in the main repo.
      - name: Init required Core submodules (shallow)
        run: |
          git submodule update --init --depth 1 \
            Cores/4DO \
            Cores/Bliss \
            Cores/CrabEMU \
            Cores/VirtualJaguar

      - name: Cache DerivedData
        uses: actions/cache@v3
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-ci-deriveddata-${{ hashFiles('**/*.xcodeproj/project.pbxproj', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-ci-deriveddata-

      - name: Build Provenance-CI (iOS Simulator)
        run: |
          set -eo pipefail
          start_time=$(date +%s)
          xcodebuild build \
            -workspace Provenance.xcworkspace \
            -scheme "Provenance-CI" \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            2>&1 | tail -100
          build_exit=${PIPESTATUS[0]}
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "### CI Build Time" >> $GITHUB_STEP_SUMMARY
          echo "Duration: ${minutes}m ${seconds}s" >> $GITHUB_STEP_SUMMARY
          exit $build_exit
