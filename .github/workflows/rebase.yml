# Manual rebase via PR comment: comment "/rebase" on any PR to trigger.
# For automatic rebase on develop push, see auto-rebase-on-develop.yml.
name: Manual Rebase
on:
  issue_comment:
    types: [created]
concurrency:
  group: rebase-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    name: Rebase
    if: github.event.issue.pull_request != '' && contains(github.event.comment.body, '/rebase')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Automatic Rebase
        uses: cirrus-actions/rebase@1.8
        env:
          GITHUB_TOKEN: ${{ github.token }}
