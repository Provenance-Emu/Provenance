# Manual rebase via PR comment: comment "/rebase" on any PR to trigger.
# For automatic rebase on develop push/merge, see auto-rebase-on-develop.yml.
#
# Uses git directly to rebase the branch onto develop.
# If conflicts are detected, dispatches Claude Code to resolve them automatically.
name: Manual Rebase
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  rebase:
    name: Rebase
    # IMPORTANT: concurrency is at the JOB level (not workflow level) so that
    # bot comments posted by this job (acknowledgment, success, etc.) do NOT
    # trigger a new run that cancels the in-progress rebase. When a workflow-
    # level concurrency group is used, ANY new run in the group cancels in-
    # progress runs before the job's `if` condition is evaluated. Moving it
    # here means the `if` is checked first; skipped jobs don't claim the group.
    concurrency:
      group: rebase-${{ github.event.issue.number }}
      cancel-in-progress: true
    if: github.event.issue.pull_request != '' && github.event.comment.body == '/rebase'
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "🔄 Rebase requested — rebasing onto \`develop\` now..." 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase PR branch onto develop
        id: rebase
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git fetch origin develop
          if ! git fetch origin "$BRANCH" 2>/dev/null; then
            echo "Cannot fetch branch '$BRANCH'"
            echo "result=fetch_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Already up to date?
          if git merge-base --is-ancestor origin/develop "origin/$BRANCH" 2>/dev/null; then
            echo "result=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "$BRANCH" "origin/$BRANCH"

          # Use git's built-in union merge driver for CHANGELOG so concurrent
          # agent PRs never create a conflict for append-only files.
          echo "CHANGELOG.md merge=union" >> .git/info/attributes
          echo "CHANGELOG*.md merge=union" >> .git/info/attributes

          if git rebase origin/develop; then
            if git push --force-with-lease origin "$BRANCH"; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              # Re-trigger CI (GITHUB_TOKEN pushes don't fire pull_request events)
              gh workflow run agent-validation.yml --repo "$REPO" -f branch="$BRANCH" -f pr_number="$PR_NUMBER" 2>/dev/null || true
              # NOTE: ai-review-trigger.yml fires on pull_request:synchronize — no explicit dispatch needed
            else
              echo "result=push_failed" >> "$GITHUB_OUTPUT"
            fi
          else
            git rebase --abort 2>/dev/null || true
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Post result comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.rebase.outputs.result }}
          BRANCH: ${{ steps.rebase.outputs.branch }}
        run: |
          case "$RESULT" in
            success)
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "✅ Rebased \`${BRANCH}\` onto \`develop\` successfully. CI and AI review re-triggered." 2>/dev/null || true
              ;;
            uptodate)
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "✅ Branch \`${BRANCH}\` is already up to date with \`develop\` — no rebase needed." 2>/dev/null || true
              ;;
            conflict)
              PR_LABELS=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels \
                --jq '[(.labels // [])[].name] | join(",")' 2>/dev/null || echo "")
              FOLLOWUP_WORKFLOW="claude-code.yml"
              FOLLOWUP_AGENT="Claude"
              if echo "$PR_LABELS" | grep -Eq '(^|,)cursor-work(,|$)'; then
                FOLLOWUP_WORKFLOW="cursor-agent.yml"
                FOLLOWUP_AGENT="Cursor"
              fi

              if gh workflow run "$FOLLOWUP_WORKFLOW" \
                   --repo "${{ github.repository }}" \
                   -f pr_number="$PR_NUMBER" \
                   -f action="fix_rebase_conflict" 2>/dev/null; then
                gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                  --body $'🤖 **Rebase conflict detected** — '"${FOLLOWUP_AGENT}"$' has been dispatched to resolve the conflicts automatically.\n\nIf conflicts cannot be resolved cleanly, the workflow will post a comment explaining what needs manual attention.' 2>/dev/null || true
              else
                gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                  --body "❌ **Rebase conflict** — conflicts could not be resolved automatically. Please resolve manually: \`git fetch origin && git checkout ${BRANCH} && git rebase origin/develop\`, fix conflicts, then \`git push --force-with-lease\`." 2>/dev/null || true
              fi
              ;;
            push_failed)
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "❌ Rebase succeeded but push was rejected (branch protection?). Please push manually with \`git push --force-with-lease\`." 2>/dev/null || true
              ;;
            fetch_failed)
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "❌ Could not fetch branch — it may have been deleted." 2>/dev/null || true
              ;;
          esac
