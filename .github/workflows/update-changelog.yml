name: Update Changelog

# Keeps CHANGELOG.md [Unreleased] section current by summarising recent commits
# every Monday morning and after manual dispatch.
#
# The job reads conventional-commit messages merged to develop since the last
# tagged release and appends new entries to the [Unreleased] block.
# It will NOT overwrite entries already in [Unreleased] — it only appends lines
# that don't already appear there (dedup by PR number).
#
# Runs as github-actions[bot]; pushes directly to develop.

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      since_ref:
        description: 'Git ref to look back from (default: last semver tag)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  update-changelog:
    name: Refresh [Unreleased] section
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Compute since-ref
        id: since
        run: |
          SINCE="${{ github.event.inputs.since_ref }}"
          if [ -z "$SINCE" ]; then
            # Last semver tag on develop
            SINCE=$(git tag --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+' | head -1)
            if [ -z "$SINCE" ]; then
              # Fall back to 30 days ago if no tags found
              SINCE=$(git log --oneline --since="30 days ago" --format="%H" | tail -1)
            fi
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "Looking back from: $SINCE"

      - name: Collect conventional commits since last tag
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE="${{ steps.since.outputs.since }}"

          # Extract conventional commits from both direct commits and merge commit bodies.
          # Merge commits (PRs) have the conventional commit message in --format="%b" (body)
          # or are squash-merged with the subject being the conventional commit.
          {
            # Direct commits with conventional commit subjects
            git log "${SINCE}..HEAD" \
              --no-merges \
              --format="%s" \
            | grep -E "^(feat|fix|refactor|perf|docs|chore|build|ci)(\([^)]+\))?:"

            # Merge commits: body lines (squash details) and subject lines like "feat: ... (#N)"
            git log "${SINCE}..HEAD" \
              --merges \
              --format="%s%n%b" \
            | grep -E "^(feat|fix|refactor|perf|docs|chore|build|ci)(\([^)]+\))?:"
          } | sort -u > /tmp/raw_commits.txt || true

          echo "Raw commits found: $(wc -l < /tmp/raw_commits.txt)"
          cat /tmp/raw_commits.txt

      - name: Generate [Unreleased] entries
        id: generate
        run: python3 Scripts/changelog_generate_entries.py

      - name: Update CHANGELOG.md
        run: |
          # Only proceed if we have new entries
          if [ ! -s /tmp/unreleased_entries.txt ]; then
            echo "No new entries to add — skipping."
            exit 0
          fi
          python3 Scripts/changelog_update_file.py

      - name: Commit changelog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet CHANGELOG.md; then
            echo "No changes to CHANGELOG.md — nothing to commit."
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "chore(changelog): update [Unreleased] from recent commits" \
            -m "Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin develop
          echo "CHANGELOG.md pushed to develop."
