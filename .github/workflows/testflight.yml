name: TestFlight

# Signed App Store Connect uploads. Deliberately SEPARATE from build.yml:
#   - build.yml produces UNSIGNED archives (CODE_SIGNING_ALLOWED=NO + ldid
#     fakesign) for the sideload/alpha release. TestFlight needs real signing,
#     so the two cannot share a job.
#   - a separate workflow means a TestFlight failure never blocks the alpha
#     release, and it gets its own concurrency group so pushes don't cancel
#     an in-flight upload.
#
# NOT on every develop push on purpose: each run consumes an App Store Connect
# build number and processing slot, and develop moves fast. It runs nightly
# instead, so TestFlight is never more than a day behind develop, and can be
# triggered explicitly at any time.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to archive and upload'
        required: true
        default: 'all'
        type: choice
        options: [all, ios, tvos]
      version:
        description: 'Override marketing version (blank = read Build.xcconfig)'
        required: false
        type: string
  push:
    tags:
      - 'v*'
  # Nightly, so TestFlight is never more than a day stale without spending an
  # App Store Connect build number on every develop push (see the note above).
  # A scheduled run archives whatever develop points at when it fires; an
  # unchanged tree still uploads, because the build number is epoch-derived and
  # App Store Connect accepts it as a new build rather than a redundant one.
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-finished upload

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  XCODE_VERSION: '26.3'
  SWIFT_PACKAGE_ALLOW_WRITING_TO_DIRECTORY: ${{ github.workspace }}

jobs:
  # Resolve which platforms this run should archive. A job-level `if` cannot see
  # the matrix context, so the selection is computed here and fed to the matrix.
  plan:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          case "${{ inputs.platform || (github.event_name == 'schedule' && 'ios' || 'all') }}" in
            ios)  M='["ios"]' ;;
            tvos) M='["tvos"]' ;;
            *)    M='["ios","tvos"]' ;;
          esac
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "archiving: $M"

  testflight:
    name: Archive and upload to TestFlight (${{ matrix.platform }})
    needs: plan
    runs-on: 'macos-26'
    # One platform per job. Previously a single job archived both in sequence,
    # and the second one — tvOS — died at the very end with exit 65 and no
    # diagnostic (run 33841167021), while iOS alone (33851969129) and tvOS alone
    # (33942015860) both succeed. Two cold archives of 60+ cores in one job is
    # the only condition under which it fails, so give each its own runner, the
    # way build.yml already does with its iphoneos/appletvos matrix. Also halves
    # wall clock, and a tvOS failure can no longer take a healthy iOS build with it.
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # A single cold archive has measured >100 min.
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Cache submodules
        id: cache-submodules
        uses: actions/cache@v4
        with:
          path: |
            .git/modules
            Cores
            CoresRetro
            Dependencies
            PVRcheevos
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-

      # actions/cache restores over the checkout, so parent-repo-tracked files
      # inside those dirs can be shadowed by a stale cached copy. Same guard
      # build.yml uses.
      - name: Restore parent-repo files inside cached paths
        run: git checkout HEAD -- Cores CoresRetro Dependencies PVRcheevos 2>/dev/null || true

      - name: Initialize submodules
        run: |
          if [ "${{ steps.cache-submodules.outputs.cache-hit }}" = "true" ]; then
            git submodule sync --recursive
            git submodule update --init --recursive --jobs 4
          else
            git submodule deinit --all -f 2>/dev/null || true
            git submodule update --init --recursive --depth 1 --jobs 4
          fi

      # Cores marked `local: true` in cores.yml (flycast-jitless, virtualjaguar)
      # live in the private provenance-dylibs release store, not on the libretro
      # buildbot. Without this step the archive only contains them if the
      # Actions cache happens to restore a modules/ dir from a prior build.yml
      # run — on a cache miss the store IPA silently ships WITHOUT them.
      # Unlike build.yml (warns and continues for alpha builds), a missing
      # token here is a hard failure: an App Store upload missing headline
      # cores is worse than a failed run.
      - name: Fetch locally-built core dylibs
        env:
          GH_TOKEN: ${{ secrets.DYLIBS_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::DYLIBS_TOKEN not set — the store IPA would be missing:"
            ./CoresRetro/RetroArch/scripts/local-dylibs.sh list || true
            exit 1
          fi
          ./CoresRetro/RetroArch/scripts/local-dylibs.sh fetch

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install tooling
        run: brew install xcbeautify 2>/dev/null || true

      # The archive embeds PVLookup's libretro cheat database. build.yml
      # generates it before archiving; this workflow did not, so the first run
      # that got past the git guard died 51 minutes in with
      #   error: lstat(.../libretro_cheats.sqlite.zip): No such file or directory
      # Same cache key as build.yml so the two share one entry.
      - name: Cache libretro cheat database
        id: cache-cheatdb
        uses: actions/cache@v4
        with:
          path: PVLookup/Sources/LibretroCheatDB/Resources/libretro_cheats.sqlite.zip
          key: cheatdb-${{ hashFiles('Scripts/generate_cheatdb.py', 'PVLookup/Scripts/generate_cheatdb_if_needed.sh') }}

      - name: Generate libretro cheat database
        if: steps.cache-cheatdb.outputs.cache-hit != 'true'
        run: |
          PVLookup/Scripts/generate_cheatdb_if_needed.sh

      # Automatic signing needs TWO identities in the keychain, not one. The
      # PROFILES are fetched by -allowProvisioningUpdates using the ASC API key
      # (release.sh passes it to the archive step), so only certs are imported
      # here — no .mobileprovision juggling.
      #
      # Why two: `xcodebuild archive` signs the ARCHIVE with an Apple Development
      # identity; only -exportArchive re-signs with Distribution. With just the
      # distribution cert present, -allowProvisioningUpdates minted a fresh
      # Development certificate on EVERY run, whose private key died with the
      # runner. 19 of those corpses accumulated between Sept 2–5 2026 across this
      # repo and iCube until Apple's per-account cap hit:
      #   error: Choose a certificate to revoke. Your account has reached the
      #          maximum number of certificates.
      # DEV_CERT_P12 is a Development identity whose key we keep (minted with
      # Scripts/asc_certs.py create), so xcodebuild reuses it instead of minting.
      # Certificates are team-wide: the same .p12 is set on iCube.
      #
      # Secret names match what this repo ALREADY has (CERT_P12 / P12_PASS), rather
      # than inventing BUILD_CERTIFICATE_BASE64 / P12_PASSWORD, which were never set
      # and would have failed the first real run for no reason.
      #
      # KEYCHAIN_PASSWORD is deliberately NOT a secret. It only ever protects a
      # throwaway keychain created and deleted inside this one job, so a stored
      # secret bought nothing and was a third thing to configure. Generated per-run
      # instead, which is also stronger than a fixed reused value.
      - name: Import signing certificates
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          P12_PASS: ${{ secrets.P12_PASS }}
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_P12_PASS: ${{ secrets.DEV_P12_PASS }}
        run: |
          set -euo pipefail
          for v in CERT_P12 DEV_CERT_P12; do
            [ -n "${!v}" ] || { echo "::error::$v secret is not set — cannot sign. See Scripts/asc_certs.py."; exit 1; }
          done
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          import_p12() {  # $1 = base64 p12, $2 = password
            local path="$RUNNER_TEMP/import.p12"
            echo -n "$1" | base64 --decode -o "$path"
            security import "$path" -P "$2" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            rm -f "$path"
          }
          import_p12 "$CERT_P12" "$P12_PASS"
          import_p12 "$DEV_CERT_P12" "$DEV_P12_PASS"
          # Let codesign use the keys without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so xcodebuild finds the identities.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          # Both must be present, or the archive step silently mints a new
          # Development cert and we are back to filling the account cap.
          for want in "Apple Distribution" "Apple Development"; do
            security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "$want" \
              || { echo "::error::no '$want' identity after import"; exit 1; }
          done

      - name: Archive and upload
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          # Base64-encoded .p8 — release.sh materialises it to a temp file.
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          set -o pipefail
          # Scheduled runs are iOS-only until the tvOS archive is fixed. tvOS
          # failed run 33841167021 with exit 65 and no diagnostic at all — no
          # ": error:" line and no "build commands failed" block — dying in its
          # final Generate/Validate Frameworks script phases. It archived fine in
          # the run before on identical code, so it is intermittent. iOS has
          # archived and uploaded cleanly every time, and a nightly defaulting to
          # "all" would fail on tvOS and mask a healthy iOS build. An explicit
          # workflow_dispatch still honours whatever platform you pick.
          ARGS=(--channel testflight --platform "${{ matrix.platform }}")
          if [ -n "${{ inputs.version }}" ]; then
            ARGS+=(--version "${{ inputs.version }}")
          fi
          # xcbeautify is installed with `|| true` because it is purely cosmetic —
          # the authoritative output is the raw log captured by tee. Piping into
          # it unconditionally under `set -o pipefail` meant a Homebrew hiccup
          # (or a runner image without it) failed the whole upload with
          # "xcbeautify: command not found" instead of a real build error. Fall
          # back to cat so only genuine failures fail this job.
          FORMATTER=cat
          if command -v xcbeautify >/dev/null 2>&1; then
            FORMATTER=xcbeautify
          else
            echo "::warning::xcbeautify unavailable — using unformatted output (raw log is unaffected)"
          fi

          # Build number: release.sh defaults to epoch seconds, which is unique
          # and strictly increasing, so App Store Connect never rejects a
          # redundant binary. Left as the default deliberately.
          ./Scripts/release.sh "${ARGS[@]}" 2>&1 | tee /tmp/testflight.log | "$FORMATTER"

      # Same rationale as build.yml: xcbeautify hides Run Script phase output,
      # so the raw log is the only place some failures appear.
      - name: Upload raw log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per-platform: upload-artifact@v4 rejects two jobs uploading one name.
          name: testflight-log-${{ matrix.platform }}
          path: /tmp/testflight.log
          retention-days: 3

      - name: Clean up keychain
        if: always()
        run: |
          security list-keychains -d user -s $(security list-keychains -d user | tr -d '"' | grep -v signing.keychain-db) || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
