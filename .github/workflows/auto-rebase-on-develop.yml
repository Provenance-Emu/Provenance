name: Auto-rebase PRs on develop push

# When develop receives new commits (push OR PR merge), automatically rebase
# all open PRs targeting develop so they stay current.
#
# Triggers:
#   push to develop    — direct commits (e.g. manual hotfixes)
#   pull_request:closed — PR was squash/merge-merged; fires reliably even when
#                         GitHub's push event is swallowed by rate-limiting or
#                         is suppressed by concurrent workflow activity
#   workflow_dispatch  — manual trigger for debugging
#
# /rebase comments are handled exclusively by rebase.yml (single-PR).
# This workflow only handles the "rebase everything after develop advances" case.
#
# Only rebases PRs from the same repo (not forks - we can't push to those).
# Skips draft PRs and PRs that are already up to date.
# Dispatches Claude to resolve rebase conflicts automatically.

on:
  push:
    branches: [develop]
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  # Only one rebase run at a time. Cancel stale runs so the latest develop
  # state wins. NOTE: only push/pull_request/workflow_dispatch events land here
  # now — bot comments no longer poison this group.
  group: auto-rebase-develop
  cancel-in-progress: true

jobs:
  rebase:
    name: Rebase open PRs onto develop
    # Only run when develop actually advanced (push/merge) or explicit dispatch.
    # For pull_request events, only fire when the PR was actually merged.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Develop was pushed to / PR merged. Looking for PRs to rebase..."
          # Fetch all open non-draft PRs targeting develop from the same repo (not forks)
          prs=$(gh api "repos/$REPO/pulls?base=develop&state=open&per_page=100" \
            --jq '.[] | select(
              .draft == false and
              .head.repo.full_name == .base.repo.full_name
            ) | {number: .number, branch: .head.ref}' \
            | jq -s '.')

          count=$(echo "$prs" | jq length)
          echo "Found $count eligible open PR(s) targeting develop."
          [ "$count" -eq 0 ] && exit 0

          git fetch origin develop
          rebased=0
          skipped_uptodate=0
          failed=0

          while IFS=$'\t' read -r pr_num branch; do
            echo ""
            echo "=== PR #$pr_num  branch: $branch ==="

            # Fetch the PR branch (may not be locally present)
            if ! git fetch origin "$branch" 2>/dev/null; then
              echo "  Cannot fetch '$branch' - skipping (branch may be deleted)"
              continue
            fi

            # Skip if already rebased onto develop (develop is already an ancestor)
            if git merge-base --is-ancestor origin/develop "origin/$branch" 2>/dev/null; then
              echo "  Already up to date - skipping"
              skipped_uptodate=$((skipped_uptodate + 1))
              continue
            fi

            # Attempt rebase
            git checkout -B "$branch" "origin/$branch"

            if git rebase origin/develop; then
              # Push rebased branch
              if git push --force-with-lease origin "$branch"; then
                echo "  Rebased and pushed successfully"
                rebased=$((rebased + 1))
                # Re-trigger CI — GITHUB_TOKEN pushes don't fire pull_request/push events
                gh workflow run agent-validation.yml --repo "$REPO" --ref "$branch" \
                  -f branch="$branch" -f pr_number="$pr_num" 2>/dev/null || true
                # NOTE: ai-review-trigger.yml fires on pull_request:synchronize — no explicit dispatch needed
              else
                echo "  Rebase succeeded but push was rejected (branch protection?)"
                failed=$((failed + 1))
              fi
            else
              echo "  Rebase conflict — dispatching Claude to resolve"
              git rebase --abort 2>/dev/null || true
              failed=$((failed + 1))

              # Dispatch Claude to resolve conflicts automatically
              if gh workflow run claude-code.yml \
                   --repo "$REPO" \
                   -f pr_number="$pr_num" \
                   -f action="fix_rebase_conflict" 2>/dev/null; then
                gh pr comment "$pr_num" --repo "$REPO" \
                  --body $'🤖 **Rebase conflict detected** — Claude has been dispatched to resolve the conflicts automatically.\n\nIf conflicts cannot be resolved cleanly, Claude will post a comment explaining what needs manual attention.' 2>/dev/null || true
              else
                # Dispatch failed — fall back to manual instructions
                gh pr comment "$pr_num" --repo "$REPO" \
                  --body $'**Auto-rebase conflict**\n\nThis PR could not be automatically rebased onto `develop` due to merge conflicts. Please rebase manually:\n\n```bash\ngit fetch origin\ngit checkout '"${branch}"'\ngit rebase origin/develop\n# resolve conflicts, then:\ngit push --force-with-lease\n```\n\nOr comment `/rebase` here to retry.' 2>/dev/null || true
              fi
            fi
          done < <(echo "$prs" | jq -r '.[] | [.number, .branch] | @tsv')

          echo ""
          echo "=== Summary ==="
          echo "  Rebased:            $rebased"
          echo "  Already up to date: $skipped_uptodate"
          echo "  Conflicts/errors:   $failed"
