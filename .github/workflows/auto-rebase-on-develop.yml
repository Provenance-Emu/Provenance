name: Auto-rebase PRs on develop push

# When develop receives new commits, automatically rebase all open PRs
# targeting develop so they stay current and merge conflicts surface early.
#
# Also handles `/rebase` comments on PRs — rebases just that PR on demand.
#
# Only rebases PRs from the same repo (not forks - we can't push to those).
# Skips draft PRs and PRs that are already up to date.
# Comments on PRs with rebase conflicts so owners can resolve manually.

on:
  push:
    branches: [develop]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: auto-rebase-develop
  cancel-in-progress: true   # Latest develop state wins; cancel stale in-progress runs

jobs:
  rebase:
    name: Rebase open PRs onto develop
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.body == '/rebase')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acknowledge /rebase command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "🔄 Rebase requested — rebasing onto \`develop\` now..." 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # /rebase comment: only process the specific PR
            echo "Manual /rebase triggered on PR #${COMMENT_PR_NUMBER}"
            PR_INFO=$(gh api "repos/$REPO/pulls/${COMMENT_PR_NUMBER}" \
              --jq '{number: .number, branch: .head.ref, draft: .draft, same_repo: (.head.repo.full_name == .base.repo.full_name)}' \
              2>/dev/null || echo "")
            if [ -z "$PR_INFO" ]; then
              echo "Could not fetch PR info — is this a PR comment?"
              exit 0
            fi
            prs=$(echo "$PR_INFO" | jq -s '.')
          else
            echo "Develop was pushed to. Looking for PRs to rebase..."
            # Fetch all open PRs targeting develop from the same repo (not forks)
            prs=$(gh api "repos/$REPO/pulls?base=develop&state=open&per_page=100" \
              --jq '.[] | select(
                .draft == false and
                .head.repo.full_name == .base.repo.full_name
              ) | {number: .number, branch: .head.ref}' \
              | jq -s '.')
          fi

          count=$(echo "$prs" | jq length)
          echo "Found $count eligible open PR(s) targeting develop."
          [ "$count" -eq 0 ] && exit 0

          git fetch origin develop
          rebased=0
          skipped_uptodate=0
          failed=0

          while IFS=$'\t' read -r pr_num branch; do
            echo ""
            echo "=== PR #$pr_num  branch: $branch ==="

            # Fetch the PR branch (may not be locally present)
            if ! git fetch origin "$branch" 2>/dev/null; then
              echo "  Cannot fetch '$branch' - skipping (branch may be deleted)"
              continue
            fi

            # Skip if already rebased onto develop (develop is already an ancestor)
            if git merge-base --is-ancestor origin/develop "origin/$branch" 2>/dev/null; then
              echo "  Already up to date - skipping"
              skipped_uptodate=$((skipped_uptodate + 1))
              # Still post a reply if this was a manual /rebase
              if [ "$EVENT_NAME" = "issue_comment" ]; then
                gh pr comment "$pr_num" --repo "$REPO" \
                  --body "✅ Branch \`${branch}\` is already up to date with \`develop\` — no rebase needed." 2>/dev/null || true
              fi
              continue
            fi

            # Attempt rebase
            git checkout -B "$branch" "origin/$branch"

            if git rebase origin/develop; then
              # Push rebased branch
              if git push --force-with-lease origin "$branch"; then
                echo "  Rebased and pushed successfully"
                rebased=$((rebased + 1))
                # Re-trigger CI — GITHUB_TOKEN pushes don't fire pull_request/push events
                gh workflow run agent-validation.yml --repo "$REPO" --ref "$branch" \
                  -f branch="$branch" 2>/dev/null || true
                # Re-trigger AI review for [Agent] PRs
                pr_title=$(gh pr view "$pr_num" --repo "$REPO" --json title --jq '.title' 2>/dev/null || echo "")
                if echo "$pr_title" | grep -q "^\[Agent\]"; then
                  gh workflow run ai-review.yml --repo "$REPO" -f pr_number="$pr_num" 2>/dev/null || true
                fi
                # Reply to manual /rebase with success
                if [ "$EVENT_NAME" = "issue_comment" ]; then
                  gh pr comment "$pr_num" --repo "$REPO" \
                    --body "✅ Rebased \`${branch}\` onto \`develop\` successfully. CI and AI review re-triggered." 2>/dev/null || true
                fi
              else
                echo "  Rebase succeeded but push was rejected (branch protection?)"
                git rebase --abort 2>/dev/null || true
                failed=$((failed + 1))
                if [ "$EVENT_NAME" = "issue_comment" ]; then
                  gh pr comment "$pr_num" --repo "$REPO" \
                    --body "❌ Rebase succeeded locally but push was rejected (branch protection rules?). Please push manually." 2>/dev/null || true
                fi
              fi
            else
              echo "  Rebase conflict - commenting on PR and skipping"
              git rebase --abort 2>/dev/null || true
              failed=$((failed + 1))

              gh pr comment "$pr_num" --repo "$REPO" --body $'**Auto-rebase conflict**\n\nThis PR could not be automatically rebased onto `develop` due to merge conflicts. Please rebase manually:\n\n```bash\ngit fetch origin\ngit checkout <your-branch>\ngit rebase origin/develop\n# resolve conflicts, then:\ngit push --force-with-lease\n```\n\nOr comment `/rebase` here to retry once conflicts are resolved on develop.'
            fi
          done < <(echo "$prs" | jq -r '.[] | [.number, .branch] | @tsv')

          echo ""
          echo "=== Summary ==="
          echo "  Rebased:            $rebased"
          echo "  Already up to date: $skipped_uptodate"
          echo "  Conflicts/errors:   $failed"
