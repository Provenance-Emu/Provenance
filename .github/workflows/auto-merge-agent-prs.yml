name: Auto-merge Agent PRs

# Automatically enable auto-merge on Agent PRs when a human approves them.
# GitHub's own auto-merge handles the actual merge once CI passes.
# Only triggers on human approvals (not bot reviews) to prevent accidental merges.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only run when a human approves an [Agent] PR
    if: |
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.title, '[Agent]') &&
      github.event.review.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        run: |
          echo "Enabling auto-merge (squash) for PR #${{ github.event.pull_request.number }}"
          echo "Approved by: ${{ github.event.review.user.login }}"
          gh pr merge "${{ github.event.pull_request.number }}" \
            --squash \
            --auto \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
