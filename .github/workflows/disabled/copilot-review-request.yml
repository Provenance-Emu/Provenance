name: Request Copilot Review on Agent PR Push

# When Claude pushes fixes to an agent branch, automatically request
# Copilot to re-review so the feedback loop continues without manual intervention.

on:
  push:
    branches:
      - 'agent/**'

permissions:
  pull-requests: write

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find PR for branch
        id: find-pr
        run: |
          PR_JSON=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --state open \
            --json number,title \
            --jq '.[0]' \
            --repo "${{ github.repository }}")
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty')
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUMBER" ]; then
            echo "Found PR #$PR_NUMBER: $PR_TITLE"
          else
            echo "No open PR found for branch ${{ github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Request Copilot review
        if: |
          steps.find-pr.outputs.pr_number != '' &&
          startsWith(steps.find-pr.outputs.pr_title, '[Agent]')
        run: |
          echo "Requesting Copilot review on PR #${{ steps.find-pr.outputs.pr_number }}"
          gh api \
            "repos/${{ github.repository }}/pulls/${{ steps.find-pr.outputs.pr_number }}/requested_reviewers" \
            --method POST \
            -f "reviewers[]=copilot-pull-request-reviewer" \
            || echo "Warning: Could not request Copilot review (may already be requested)"
        env:
          GH_TOKEN: ${{ github.token }}
