name: AI Review Trigger

# Auto-trigger DISABLED — GitHub Copilot handles PR reviews.
# Trigger manually with:
#   - Comment `/ai-review` on any PR
#   - `gh workflow run ai-review.yml -f pr_number=<N>`

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  dispatch:
    name: Dispatch on /ai-review comment
    # Only fire on `/ai-review` comments on PRs (not issues)
    if: |
      github.event.issue.pull_request != '' &&
      github.event.comment.body == '/ai-review'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ai-review.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          REPO="${{ github.repository }}"
          echo "Dispatching AI review for PR #$PR_NUMBER"
          gh workflow run ai-review.yml --repo "$REPO" -f pr_number="$PR_NUMBER"
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "🤖 AI code review dispatched — results will be posted shortly." \
            2>/dev/null || true
