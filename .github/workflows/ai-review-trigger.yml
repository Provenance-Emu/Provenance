name: AI Review Trigger

# Lightweight trigger: catches pull_request events on agent/** branches,
# then dispatches ai-review.yml via workflow_dispatch.
#
# Why pull_request instead of push:
#   The agent (claude-code-action) pushes the branch THEN creates the PR in two
#   separate steps. A push-event trigger fires before the PR exists, so
#   `gh pr list` returns nothing and the review is silently skipped.
#   pull_request:opened fires after both the push AND the PR creation are done.
#   pull_request:synchronize fires on every subsequent push to an open PR,
#   including force-pushes from rebase (which also use GITHUB_TOKEN and
#   therefore don't fire push events in other workflows).
#
# This indirection is needed because claude-code-action@v1 does not support
# push event contexts — it requires issue_comment, pull_request, or workflow_dispatch.

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

permissions:
  contents: read
  actions: write   # To dispatch ai-review.yml

jobs:
  dispatch:
    name: Find PR & dispatch review
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ai-review.yml for [Agent] PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          REPO="${{ github.repository }}"

          echo "PR #$PR_NUMBER — $PR_TITLE (branch: $HEAD_BRANCH)"

          # Auto-review only [Agent] PRs from agent/** branches
          if ! echo "$PR_TITLE" | grep -q "^\[Agent\]"; then
            echo "Not an [Agent] PR — skipping auto-review."
            exit 0
          fi

          if ! echo "$HEAD_BRANCH" | grep -q "^agent/"; then
            echo "Not an agent/** branch — skipping auto-review."
            exit 0
          fi

          # Dedup guard: skip if ai-review.yml was already dispatched in the last 60 seconds.
          # Prevents double-dispatch when concurrent events fire (e.g. synchronize + explicit dispatch).
          RECENT=$(gh run list --workflow=ai-review.yml --repo "$REPO" --limit 10 \
            --json createdAt \
            --jq "now as \$now | [.[] | select(\$now - (.createdAt | fromdateiso8601) < 60)] | length" \
            2>/dev/null || echo "0")
          if [ "${RECENT:-0}" -gt 0 ]; then
            echo "ai-review.yml dispatched within last 60s — skipping to prevent duplicate review"
            exit 0
          fi

          echo "Dispatching AI review for PR #$PR_NUMBER ($PR_TITLE)"
          gh workflow run ai-review.yml \
            --repo "$REPO" \
            -f pr_number="$PR_NUMBER"
