name: Update Sideload Feed

# Regenerates the AltStore/SideStore JSON source files and commits them to the
# provenance-emu.github.io repo whenever a release or alpha build is published.
#
# The JSON files are hosted at:
#   https://provenance-emu.com/apps.json             <- canonical; what /altstore
#                                                       and /sidestore deep-link to
#   https://provenance-emu.com/altstore-source.json  <- alias
#   https://provenance-emu.com/sidestore-source.json <- alias
#
# They MUST be written into the pages repo's static/ directory. That repo is a
# Hugo site whose gh-pages.yml deploys ./public, and Hugo only copies static/
# into public/ — a file committed at the repo root is never published and 404s.
#
# Stable releases appear as "Provenance" (com.provenance-emu.provenance).
# Alpha builds appear as "Provenance Alpha" (com.provenance-emu.provenance.alpha)
# — a SEPARATE app entry so AltStore/SideStore shows them as two distinct apps.
# build.yml gives alpha builds that bundle ID via ALPHA_BUNDLE_SUFFIX, so the
# two install side by side.
#
# Versioning note: per the AltStore source spec, `version` must equal the IPA's
# CFBundleShortVersionString and `buildVersion` its CFBundleVersion, exactly.
# build.yml stamps alpha with MARKETING_VERSION (a plain "3.4.0", NOT suffixed)
# and CURRENT_PROJECT_VERSION=$(git rev-list --count HEAD). So the alpha entry
# carries version=3.4.0 + buildVersion=<commit count>; the commit count is what
# actually increments between alpha builds and drives update detection. Putting
# the sha/date in `version` instead makes it a semver PRE-RELEASE, which sorts
# BELOW the installed 3.4.0 — AltStore then never offers the update. The pretty
# string lives in `marketingVersion`, which is display-only and unconstrained.
#
# AltStore and SideStore are iOS-only, so only the iOS IPA is emitted. The tvOS
# IPA stays on the GitHub release for manual sideloading.

on:
  release:
    types: [published, edited]
  workflow_run:
    workflows: ["Build and Upload Provenance"]
    types: [completed]
    branches: [develop]
  # Companion apps (iFly, iCube) live in their own repos and cannot trigger a
  # workflow here directly. They POST a repository_dispatch after publishing a
  # release so the combined feed picks the new build up immediately instead of
  # waiting for the next Provenance build. Sending one needs a PAT with `repo`
  # scope in THEIR repo (GITHUB_TOKEN cannot dispatch cross-repo) — see
  # docs/sideload-feed.md.
  repository_dispatch:
    types: [companion-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-feed:
    name: Generate sideload JSON feed
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate AltStore + SideStore JSON
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ── Fetch all non-draft releases (stable + pre-release) ───────────
          # The entire feed is built from this one call, and the job runs
          # unattended on every develop build, so retry a transient 5xx or
          # secondary rate-limit rather than losing a publish to it.
          #
          # Then REFUSE to continue on an empty result. This replaced an
          # `|| echo "[]"` fallback, which was actively harmful: an empty array
          # generates a structurally valid feed with zero versions, which the
          # stores read as "this app has no releases" — silently emptying the
          # listing instead of leaving the last good feed in place. Failing the
          # job leaves the previously published JSON untouched.
          # Shared by this repo and the companion apps (iFly, iCube). Echoes a
          # JSON array of non-draft releases, or nothing on persistent failure —
          # callers decide whether that is fatal.
          fetch_releases() {
            local repo="$1" out=""
            for attempt in 1 2 3 4; do
              if out=$(gh api "repos/${repo}/releases?per_page=50" \
                   --jq '[.[] | select(.draft == false)]'); then
                printf '%s' "$out"; return 0
              fi
              out=""
              if [ "$attempt" -lt 4 ]; then
                echo "gh api ${repo} failed (attempt ${attempt}/4) — retrying in $((attempt * 5))s" >&2
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          ALL_RELEASES=$(fetch_releases "$REPO" || true)

          if [ -z "$ALL_RELEASES" ] || [ "$(echo "$ALL_RELEASES" | jq 'length')" -eq 0 ]; then
            echo "::error::Could not fetch a non-empty release list after 4 attempts — refusing to publish an empty feed."
            exit 1
          fi

          STABLE_RELEASES=$(echo "$ALL_RELEASES" | \
            jq '[.[] | select(.prerelease == false and (.tag_name | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$")))]')

          # ── Stable versions ──────────────────────────────────────────────
          # One entry per release, iOS IPA only. Sizes come straight from the
          # asset JSON: `curl -sI` on a browser_download_url without -L only
          # sees GitHub's 302 and reports no content-length.
          #
          # buildVersion is deliberately omitted for stable. Tagged releases are
          # cut by Scripts/release.sh, which stamps epoch-derived build numbers
          # that `git rev-list --count` cannot reproduce — a wrong buildVersion
          # is worse than none, and distinct semver versions are already enough
          # for AltStore to order stable releases.
          #
          # minOSVersion is omitted for the same reason. AltStore HIDES versions
          # whose minOSVersion the device cannot meet, and the back catalogue
          # here reaches down to 2.0.0, which shipped long before the iOS 17
          # floor. Stamping today's floor onto every historical entry would hide
          # the only installable builds from exactly the old devices that need
          # them. We have no per-release floor to publish, so we publish none —
          # which is also what the served feed did before this generator.
          STABLE_VERSIONS=$(echo "$STABLE_RELEASES" | jq '[
            .[] | . as $rel |
            ([$rel.assets[] | select(.name | test("iOS\\.ipa$"; "i"))] | first) as $ios |
            select($ios != null) |
            {
              version: ($rel.tag_name | ltrimstr("v")),
              date: (($rel.published_at // $rel.created_at) | .[0:10]),
              # Same plain-text constraint as the alpha entry below: the store
              # apps do not render Markdown. Stable bodies are hand-written
              # changelogs rather than generated, so only strip the syntax that
              # reads as garbage (heading hashes, table pipe-rows, blockquote
              # markers, fences, horizontal rules) and keep the prose as-is.
              localizedDescription: (
                (($rel.body // "") | gsub("\r"; ""))
                | split("\n")
                | map(select(test("^\\s*(\\|.*\\||[-*_]{3,})\\s*$") | not))
                | map(select(test("^\\s*```") | not))
                | map(sub("^\\s*#{1,6}\\s*"; ""))
                | map(sub("^\\s*>\\s?"; ""))
                | join("\n")
                | gsub("\n{3,}"; "\n\n")
                | .[0:2800]
              ),
              downloadURL: $ios.browser_download_url,
              size: $ios.size
            }
          ]')

          # ── Alpha version ────────────────────────────────────────────────
          # `alpha` is a single rolling tag, so the feed carries exactly one
          # entry; a history of alphas would need distinct buildVersions we no
          # longer have IPAs for anyway.
          ALPHA_REL=$(echo "$ALL_RELEASES" | jq '(map(select(.tag_name == "alpha")) | first) // null')
          ALPHA_VERSIONS="[]"

          if [ "$ALPHA_REL" != "null" ]; then
            # .target_commitish on a rolling release is the BRANCH NAME
            # ("develop"), not a sha — resolving the ref is what actually yields
            # the commit. /commits/<ref> handles annotated tags in one call.
            # Every lookup below is guarded: under `set -e` an unguarded failure
            # (e.g. grep finding nothing) aborts the step instead of falling
            # through to the warning, which would take the STABLE feed down too.
            ALPHA_SHA=$(gh api "repos/${REPO}/commits/alpha" --jq '.sha' 2>/dev/null || echo "")
            ALPHA_SHORT_SHA="${ALPHA_SHA:0:7}"

            # Read MARKETING_VERSION from the exact commit that was built, so
            # `version` matches the IPA even if develop has moved on since.
            ALPHA_MARKETING=""
            if [ -n "$ALPHA_SHA" ]; then
              ALPHA_MARKETING=$(gh api "repos/${REPO}/contents/Build.xcconfig?ref=${ALPHA_SHA}" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
                | grep '^MARKETING_VERSION' | cut -d'=' -f2 | xargs || echo "")
            fi

            # Mirrors build.yml's BUILD_NUMBER=$(git rev-list --count HEAD).
            ALPHA_BUILD=""
            if [ -n "$ALPHA_SHA" ]; then
              git fetch --quiet origin "$ALPHA_SHA" 2>/dev/null || true
              ALPHA_BUILD=$(git rev-list --count "$ALPHA_SHA" 2>/dev/null || echo "")
            fi

            if [ -z "$ALPHA_MARKETING" ] || [ -z "$ALPHA_BUILD" ]; then
              echo "::warning::Could not resolve alpha version (marketing='${ALPHA_MARKETING}' build='${ALPHA_BUILD}') — skipping alpha entry."
            else
              ALPHA_VERSIONS=$(echo "$ALPHA_REL" | jq \
                --arg version "$ALPHA_MARKETING" \
                --arg build "$ALPHA_BUILD" \
                --arg sha "$ALPHA_SHORT_SHA" '
                . as $rel |
                # Prefer the extension-free IPA for the sideload feed.
                # Every embedded .appex consumes one of the 10 App IDs a free
                # Apple ID gets per 7 days, and the full build ships ~8 of them --
                # enough that one install locks the user out for a week. The
                # feed audience IS free-account sideloaders, so they get the
                # 1-App-ID variant by default; the full build with widgets,
                # Spotlight and the Files provider stays on the GitHub release
                # for anyone who wants it. Falls back to the full IPA for
                # releases cut before this variant existed.
                (([$rel.assets[] | select(.name | test("iOS-NoExtensions\\.ipa$"; "i"))] | first)
                 // ([$rel.assets[] | select(.name | test("iOS\\.ipa$"; "i"))] | first)) as $ios |
                if $ios == null then [] else
                  (($rel.published_at // $rel.created_at) | .[0:10]) as $date |
                  [{
                    version: $version,
                    buildVersion: $build,
                    marketingVersion: ($version + "-alpha." + ($date | gsub("-"; "")) + "." + $sha),
                    date: $date,
                    # AltStore/SideStore render this as PLAIN TEXT in the app
                    # what-is-new panel -- they do not parse Markdown. Dumping
                    # $rel.body verbatim (what this used to do) therefore showed
                    # a literal `|---|---|` table, a ``` fence, a > blockquote,
                    # and install instructions telling you to add the very
                    # source you are already reading it in. Build the note
                    # instead: header line, then the commit SUBJECTS with their
                    # SHAs stripped, since the SHA is noise on a phone.
                    localizedDescription: (
                      (($rel.body // "") | gsub("\r"; "")) as $body |
                      ($body | split("```")) as $parts |
                      (if ($parts | length) > 1
                       then ($parts[1] | split("\n")
                             | map(select(length > 0))
                             | map(sub("^[0-9a-f]{7,40}\\s+"; ""))
                             | map("• " + .))
                       else [] end) as $commits |
                      ("Alpha build " + $sha + " · " + $date
                       + (if ($commits | length) > 0
                          then "\n\nChanges in this build:\n" + ($commits | join("\n"))
                          else "" end)
                       + "\n\nInstalls alongside the stable app. Built automatically from develop — expect rough edges.")
                      | .[0:2800]
                    ),
                    downloadURL: $ios.browser_download_url,
                    size: $ios.size,
                    minOSVersion: "17.0"
                  }]
                end')
            fi
          fi

          # ── Companion apps (iFly, iCube) ─────────────────────────────────
          # One source URL should hand the user every app we ship, so the feed
          # carries the sibling emulators too. AltStore keys apps by
          # bundleIdentifier, so distinct bundle IDs coexist in one source with
          # no collision.
          #
          # iFly's SOURCE repo is private, which does not matter here: only the
          # download has to be public, and its pipeline already publishes IPAs
          # to the public JoeMatt/iFly-releases (its RELEASES_REPO). We read
          # release metadata from that public repo, never from the private one.
          # GITHUB_TOKEN can read public repos, so no PAT is needed.
          #
          # Icons come from each product's own site rather than
          # raw.githubusercontent, because the iFly source repo is private and
          # its raw URLs would 401 for the stores.
          #
          # DEFENSIVE: a companion with no usable release yields an EMPTY array
          # and its app entry is dropped entirely below. Emitting an entry with
          # zero versions would make the stores show "no releases" for a real
          # app; dropping it just means it is not listed yet. As of writing,
          # JoeMatt/iFly-releases has no releases at all, so this path is live.
          companion_versions() {
            local repo="$1" releases
            releases=$(fetch_releases "$repo" || true)
            if [ -z "$releases" ]; then
              echo "::warning::Could not read releases for ${repo} — omitting from feed"
              echo '[]'; return 0
            fi
            # Asset picking is fussier than it looks. The iCube release carries
            # THREE IPAs — iOS, tvOS, and iOS-TrollStore — and a naive
            # `test("\\.ipa$")` grabs the TrollStore one, which installs by a
            # completely different route and is wrong for AltStore/SideStore.
            # So: exclude tvOS (no store support) and TrollStore (wrong
            # installer), then prefer an extension-free build if one exists.
            echo "$releases" | jq '[
              .[] | . as $rel |
              ([$rel.assets[]
                | select(.name | test("\\.ipa$"; "i"))
                | select(.name | test("tvOS"; "i") | not)
                | select(.name | test("trollstore"; "i") | not)]) as $candidates |
              (($candidates | map(select(.name | test("NoExtensions"; "i"))) | first)
               // ($candidates | first)) as $ios |
              select($ios != null) |
              {
                version: ($rel.tag_name | ltrimstr("v")),
                date: (($rel.published_at // $rel.created_at) | .[0:10]),
                localizedDescription: (
                  (($rel.body // "") | gsub("\r"; ""))
                  | split("\n")
                  | map(select(test("^\\s*(\\|.*\\||[-*_]{3,})\\s*$") | not))
                  | map(select(test("^\\s*```") | not))
                  | map(sub("^\\s*#{1,6}\\s*"; ""))
                  | map(sub("^\\s*>\\s?"; ""))
                  | join("\n") | gsub("\n{3,}"; "\n\n") | .[0:2800]
                ),
                downloadURL: $ios.browser_download_url,
                size: $ios.size
              }
            ]'
          }

          IFLY_VERSIONS=$(companion_versions "${IFLY_RELEASES_REPO:-JoeMatt/iFly-releases}")
          ICUBE_VERSIONS=$(companion_versions "${ICUBE_RELEASES_REPO:-Provenance-Emu/iCube}")
          echo "companion versions — iFly: $(echo "$IFLY_VERSIONS" | jq 'length'), iCube: $(echo "$ICUBE_VERSIONS" | jq 'length')"

          # ── News (carried over from the retired pages-repo generator) ─────
          NEWS=$(echo "$STABLE_RELEASES" | jq '[
            .[0:3][] | {
              title: (.name // .tag_name),
              identifier: ("release-" + (.tag_name | ltrimstr("v"))),
              caption: (
                (.body // "") | gsub("\r"; "") | gsub("#{1,6}\\s*"; "") |
                split("\n") | map(select(length > 0)) | .[0:2] | join(" ") |
                if length > 200 then .[0:197] + "..." else . end
              ),
              date: (.published_at // .created_at),
              tintColor: "8A2BE2",
              url: .html_url,
              appID: "com.provenance-emu.provenance",
              notify: false
            }
          ]')

          # ── Assemble the feed ────────────────────────────────────────────
          jq -n \
            --argjson stable_versions "$STABLE_VERSIONS" \
            --argjson alpha_versions "$ALPHA_VERSIONS" \
            --argjson ifly_versions "$IFLY_VERSIONS" \
            --argjson icube_versions "$ICUBE_VERSIONS" \
            --argjson news "$NEWS" \
            '{
              name: "Provenance Emulator",
              identifier: "com.provenance-emu.provenance.altstore",
              sourceURL: "https://provenance-emu.com/apps.json",
              apps: [
                {
                  name: "Provenance",
                  bundleIdentifier: "com.provenance-emu.provenance",
                  developerName: "Provenance-EMU",
                  subtitle: "Multi-system retro emulator for iOS & tvOS",
                  localizedDescription: "Provenance supports 60+ retro gaming systems including NES, SNES, N64, Genesis, PlayStation, GBA, and many more. Features iCloud sync, controller skins, RetroAchievements, and a beautiful native UI.",
                  iconURL: "https://raw.githubusercontent.com/Provenance-Emu/Provenance/develop/Provenance/Resources/Assets.xcassets/AppIcon.appiconset/iTunesArtwork%402x.png",
                  tintColor: "8A2BE2",
                  screenshotURLs: [],
                  versions: $stable_versions,
                  appPermissions: {
                    entitlements: [
                      { name: "com.apple.security.application-groups" },
                      { name: "com.apple.developer.icloud-services" },
                      { name: "com.apple.developer.icloud-container-identifiers" }
                    ],
                    privacy: [
                      { name: "LocalNetwork", usageDescription: "Used to discover and connect to local network game servers for netplay." },
                      { name: "Camera", usageDescription: "Used to scan QR codes for importing game data." }
                    ]
                  }
                },
                {
                  name: "Provenance Alpha",
                  bundleIdentifier: "com.provenance-emu.provenance.alpha",
                  developerName: "Provenance-EMU",
                  subtitle: "Latest dev builds - test new features early",
                  localizedDescription: "Alpha builds of Provenance from the develop branch. These builds include the latest features and fixes but may contain bugs. Install alongside the stable version to test new features without losing your stable install.\n\nSupports 60+ retro gaming systems including NES, SNES, N64, Genesis, PlayStation, GBA, and many more.",
                  iconURL: "https://raw.githubusercontent.com/Provenance-Emu/Provenance/develop/Provenance/Resources/Assets.xcassets/AppIcon.appiconset/iTunesArtwork%402x.png",
                  tintColor: "FF6B35",
                  screenshotURLs: [],
                  versions: $alpha_versions,
                  appPermissions: {
                    entitlements: [
                      { name: "com.apple.security.application-groups" },
                      { name: "com.apple.developer.icloud-services" },
                      { name: "com.apple.developer.icloud-container-identifiers" }
                    ],
                    privacy: [
                      { name: "LocalNetwork", usageDescription: "Used to discover and connect to local network game servers for netplay." },
                      { name: "Camera", usageDescription: "Used to scan QR codes for importing game data." }
                    ]
                  }
                },
                {
                  name: "iFly EMU",
                  bundleIdentifier: "com.joemattiello.ifly",
                  developerName: "Provenance-EMU",
                  subtitle: "Sega Dreamcast, NAOMI & Atomiswave emulator",
                  localizedDescription: "iFly EMU brings Dreamcast, NAOMI and Atomiswave emulation to iOS, built on flycast with a native interface, controller support, and high-resolution rendering.",
                  iconURL: "https://ifly-emu.com/icon-1024.png",
                  tintColor: "1E9BD8",
                  screenshotURLs: [],
                  versions: $ifly_versions
                },
                {
                  name: "iCube",
                  # MUST equal the IPA's CFBundleIdentifier or the stores
                  # will not match installs/updates. iCube's
                  # Config/BundleIdentifier.xcconfig composes
                  # DOL_PBID_ORGANIZATION_IDENTIFIER (com.joemattiello) +
                  # DOL_PBID_APP_NAME (iCube), and Release (Non-Jailbroken) —
                  # the build this feed serves — is plain com.joemattiello.iCube.
                  # (Note the capital C; TrollStore would be .iCube-ts, which
                  # this feed deliberately does not serve.)
                  bundleIdentifier: "com.joemattiello.iCube",
                  developerName: "Provenance-EMU",
                  subtitle: "GameCube & Wii emulator for iOS",
                  localizedDescription: "iCube is a GameCube and Wii emulator for iOS based on Dolphin, with native controller support, save states, and hardware-accelerated rendering.",
                  iconURL: "https://icube-emu.com/icon-1024.png",
                  tintColor: "5B8DEF",
                  screenshotURLs: [],
                  versions: $icube_versions
                }
              ]
              # Drop any app that has no usable version. An entry with an empty
              # versions array makes AltStore/SideStore render a real app as
              # "no releases available"; omitting it simply leaves it unlisted
              # until its first IPA ships. Provenance stable/alpha always have
              # versions by this point (the job aborts earlier otherwise), so in
              # practice this only gates the companions.
              | map(select((.versions | length) > 0)),
              news: $news
            }' > /tmp/feed-base.json

          # Each file's sourceURL must equal the URL it is served from, or the
          # store silently refreshes from the wrong (or missing) location.
          # apps.json keeps the original identifier: it is the URL every user
          # who added the source from the website already has installed.
          BASE="https://provenance-emu.com"
          jq --arg u "$BASE/apps.json" '.sourceURL = $u' \
            /tmp/feed-base.json > /tmp/apps.json
          jq --arg u "$BASE/altstore-source.json" '.sourceURL = $u' \
            /tmp/feed-base.json > /tmp/altstore-source.json
          jq --arg u "$BASE/sidestore-source.json" \
            '.identifier = "com.provenance-emu.provenance.sidestore" | .sourceURL = $u' \
            /tmp/feed-base.json > /tmp/sidestore-source.json

          for f in apps altstore-source sidestore-source; do
            jq empty "/tmp/${f}.json" && echo "${f}.json is valid JSON"
          done

          STABLE_COUNT=$(echo "$STABLE_VERSIONS" | jq 'length')
          ALPHA_COUNT=$(echo "$ALPHA_VERSIONS" | jq 'length')
          echo "Generated feed: ${STABLE_COUNT} stable entries, ${ALPHA_COUNT} alpha entries."
          echo "stable_count=${STABLE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "alpha_count=${ALPHA_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Push feed to provenance-emu.github.io
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          git clone git@github.com:Provenance-Emu/provenance-emu.github.io.git /tmp/pages-repo

          # static/ — NOT the repo root. Hugo publishes ./public, into which it
          # copies static/; anything at the root is left out of the build.
          # mkdir -p is belt-and-braces: static/ has ~174 tracked files today so
          # the clone always creates it, but a cp into a missing directory fails
          # with a bare ENOENT that reads like a permissions problem.
          mkdir -p /tmp/pages-repo/static
          cp /tmp/apps.json             /tmp/pages-repo/static/apps.json
          cp /tmp/altstore-source.json  /tmp/pages-repo/static/altstore-source.json
          cp /tmp/sidestore-source.json /tmp/pages-repo/static/sidestore-source.json

          cd /tmp/pages-repo

          # Remove the root copies this workflow used to write, which were never
          # served and only shadow the real ones during local greps.
          git rm --quiet --ignore-unmatch altstore-source.json sidestore-source.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add static/apps.json static/altstore-source.json static/sidestore-source.json

          if git diff --cached --quiet; then
            echo "No changes to feed — skipping commit."
          else
            # NO [skip ci] here. gh-pages.yml triggers on push to main, and
            # GitHub honours skip directives on push events — tagging the commit
            # would suppress the Pages rebuild and the feed would never deploy.
            git commit -m "chore: update AltStore/SideStore JSON feed"
            git push origin HEAD
            echo "Feed updated and pushed to provenance-emu.github.io"
          fi

          rm -f ~/.ssh/deploy_key
