name: Validate Core Versions

on:
  workflow_dispatch:
    inputs:
      fix:
        description: 'Update Core.plist files where a better version is found'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # Run weekly on Mondays at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Scan and Validate Core Versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout submodules so we can scan source files for version strings.
          # Using 'recursive' ensures nested submodules (e.g. libretro cores) are
          # also initialised.  This is slow but necessary for source-level scanning.
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run version audit (report only)
        id: audit
        run: |
          python3 Scripts/update_core_versions.py --json > /tmp/core_versions.json
          python3 Scripts/update_core_versions.py | tee /tmp/core_versions_report.txt
          # Count needs-update entries
          needs=$(python3 -c "
          import json, sys
          data = json.load(open('/tmp/core_versions.json'))
          print(sum(1 for r in data if r.get('needs_update')))
          ")
          echo "needs_update=$needs" >> "$GITHUB_OUTPUT"

      - name: Apply fixes (if requested)
        if: ${{ inputs.fix == true }}
        run: |
          python3 Scripts/update_core_versions.py --fix | tee /tmp/core_versions_fixes.txt

      - name: Create Pull Request with fixes
        if: ${{ inputs.fix == true }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Core.plist versions from source scan"
          branch: "chore/update-core-versions"
          delete-branch: true
          title: "[Agent] chore: update Core.plist versions from source scan"
          body: |
            ## Automated Core Version Update

            This PR was generated by the `validate-core-versions` workflow using
            `Scripts/update_core_versions.py --fix`.

            The script scans each core's source tree for version strings in:
            - `version.h` / `Version.h`
            - `configure.ac`
            - `CMakeLists.txt`
            - Plain `VERSION` / `.version` files
            - `retro_get_system_info()` implementations (for libretro wrapper cores)

            Note: RetroArch sub-core versions (the 100+ `.libretro.framework` cores)
            are updated at **runtime** by `LibretroMetadataReader` which reads the
            compiled dylib `__cstring` section — those plists intentionally carry
            static fallback versions.

            Part of #3227

      - name: Post report as job summary
        if: always()
        run: |
          echo "## Core Version Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/core_versions_report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-version-report
          path: /tmp/core_versions.json
          retention-days: 30
