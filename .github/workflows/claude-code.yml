name: Claude Code Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
    # NOTE: Only human review events reach this trigger in practice.
    # AI reviews from ai-review.yml are dispatched here via workflow_dispatch,
    # bypassing GitHub's "action_required" approval gate for bot events.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to act on'
        required: true
      action:
        description: 'Action: fix_ai_review | ai_approved'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-code-${{ github.event.inputs.pr_number || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Run when:
    # 1. @claude is mentioned in issue or PR comments
    # 2. Issues labeled/opened with 'agent-work'
    # 3. @claude is mentioned in a PR review comment (inline)
    # 4. A HUMAN reviewer requests changes on an [Agent] PR
    # 5. /claude-fix in a PR comment
    # 6. Dispatched by ai-review.yml (fix_ai_review or ai_approved)
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/claude-fix')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'agent-work') ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       contains(toJSON(github.event.issue.labels.*.name), 'agent-work')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'changes_requested' &&
       startsWith(github.event.pull_request.title, '[Agent]') &&
       github.event.review.user.type != 'Bot') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: "--allowedTools 'Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh pr merge:*),Bash(gh issue edit:*),Bash(gh label:*),Bash(gh api:*),Bash(git:*),Bash(swift:*),Bash(swiftlint:*),Read,Write,Edit,Glob,Grep'"
          prompt: |
            You are working on the Provenance emulator app repository.
            Read CLAUDE.md for project conventions and module structure.

            ## GitHub Context
            - Repository: ${{ github.repository }}
            - Event: ${{ github.event_name }}
            - Actor: ${{ github.actor }}
            - Issue/PR number: ${{ github.event.inputs.pr_number || github.event.issue.number || github.event.pull_request.number }}
            - Issue title: ${{ github.event.issue.title || github.event.pull_request.title || '' }}

            ## Trigger Context
            ${{ github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && 'A human reviewer requested changes on this PR. Read all review comments and fix them.' || '' }}
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'fix_ai_review' && format('The AI reviewer requested changes on PR #{0}. Read ALL review comments and fix every issue. Post a marker comment when done.', github.event.inputs.pr_number) || '' }}
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'ai_approved' && format('The AI reviewer has approved PR #{0} (or max review cycles reached). Enable auto-merge, add the ready-for-review label, and assign @JoeMatt for final review. Post a summary comment.', github.event.inputs.pr_number) || '' }}
            ${{ contains(github.event.comment.body || '', '/claude-fix') && 'Fix all pending review comments on this PR. Read the full review, address each comment, commit fixes, and push.' || '' }}

            ## User Request
            ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || '' }}

            ## Core Instructions
            1. Address the trigger context and user request above
            2. Post progress/responses as comments:
               - On issues: `gh issue comment <number> --body "..."`
               - On PRs: `gh pr comment <number> --body "..."`
               - The issue/PR number is: ${{ github.event.inputs.pr_number || github.event.issue.number || github.event.pull_request.number }}
            3. Target all PRs to the **'develop'** branch
            4. Prefix agent PR titles with '[Agent]'
            5. Do NOT modify submodule source code directly
            6. Do NOT modify project.pbxproj unless absolutely necessary
            7. Keep changes focused — one logical change per PR
            8. CRITICAL: Never use "Closes #N" or "Fixes #N" for EPIC or parent issues.
               Only use "Closes" for the specific sub-task issue your PR fully completes.
               Reference epics/parent issues with "Part of #N" to prevent premature closure.

            ## NO DUPLICATE PRs — CRITICAL
            Before creating any PR or branch:
            - Check for an existing open PR on the same branch: `gh pr list --head "agent/issue-<N>" --state open --repo $GITHUB_REPOSITORY`
            - If one exists, push fixes to THAT branch — never open a second PR
            - When dispatched to fix AI review comments, determine the correct branch:
              `gh pr view <pr_number> --json headRefName --jq .headRefName`
              Then: `git fetch origin && git checkout <branch> && git pull origin <branch>`
              Make fixes, commit, push to THAT branch. Never create a new branch or PR.

            ## Review Pipeline (for [Agent] PRs)

            **After creating a new PR:**
            9.  Enable auto-merge immediately: `gh pr merge <number> --auto --squash --repo $GITHUB_REPOSITORY`
            10. Add the 'agent-work' label: `gh pr edit <number> --add-label agent-work`
            11. Post a comment: "🤖 PR created. Auto-merge enabled. AI review will start automatically."
            NOTE: Do NOT manually request a review — ai-review.yml fires automatically on the push.

            **When fixing AI review comments (fix_ai_review):**
            12. Get the PR branch: `gh pr view <number> --json headRefName --jq .headRefName`
            13. Checkout the branch: `git fetch origin && git checkout <branch> && git pull origin <branch>`
            14. Fetch the latest AI review body:
                `gh api repos/$GITHUB_REPOSITORY/pulls/<number>/reviews \
                  --jq '[.[] | select(.user.login == "github-actions[bot]")] | sort_by(.submitted_at) | last | .body'`
            15. Also fetch inline comments from the review:
                `gh api repos/$GITHUB_REPOSITORY/pulls/<number>/comments \
                  --jq '[.[] | select(.user.login == "github-actions[bot]")] | .[] | {path, line: .original_line, body}'`
            16. Fix every CRITICAL and MAJOR issue. Fix MINOR issues where trivial.
            17. Commit with message: `fix: address AI review — <brief summary of changes>`
            18. Push to the EXISTING branch (never create a new branch or PR):
                `git push origin <branch>`
            19. Post a marker comment:
                `gh pr comment <number> --body "<!-- ai-review-processed -->\n✅ Addressed AI review: <summary>"`
            NOTE: Do NOT manually re-request a review. The push to the branch automatically
                  triggers ai-review.yml for the next review cycle.

            **When AI review approves (ai_approved):**
            20. Enable auto-merge if not already: `gh pr merge <number> --auto --squash --repo $GITHUB_REPOSITORY`
            21. Add the 'ready-for-review' label: `gh pr edit <number> --add-label ready-for-review`
            22. Assign for final human review: `gh pr edit <number> --add-assignee JoeMatt --add-reviewer JoeMatt`
            23. Post a summary comment: "✅ AI review passed. Auto-merge enabled. Ready for @JoeMatt's final review."
