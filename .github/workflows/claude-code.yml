name: Claude Code Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  # NOTE: pull_request_review_comment removed — it caused every Copilot
  # review comment to create an action_required run (GitHub requires
  # approval for bot-triggered PR review events before evaluating the
  # job's `if` condition). Users can still @claude in normal PR comments
  # via issue_comment, which covers the same use case without the noise.
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-code-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Run when:
    # 1. @claude is mentioned in issue/PR comments
    # 2. Issues are labeled with 'agent-work'
    # 3. Issues are opened with 'agent-work' label
    # 4. /claude-fix in a PR comment (trigger fix of all review comments)
    # 5. A human reviewer requests changes on an [Agent] PR (auto-fix)
    # 6. Copilot reviews an [Agent] PR (auto-fix review comments)
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/claude-fix')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'agent-work') ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       contains(toJSON(github.event.issue.labels.*.name), 'agent-work')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'changes_requested' &&
       startsWith(github.event.pull_request.title, '[Agent]') &&
       github.event.review.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review' &&
       startsWith(github.event.pull_request.title, '[Agent]') &&
       github.event.review.user.login == 'copilot-pull-request-reviewer')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Do NOT checkout submodules — saves ~15 min + GB of bandwidth
          submodules: false
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: "--allowedTools 'Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh issue edit:*),Bash(git:*),Bash(swift:*),Bash(swiftlint:*),Read,Write,Edit,Glob,Grep'"
          prompt: |
            You are working on the Provenance emulator app repository.
            Read CLAUDE.md for project conventions and module structure.

            ## GitHub Context
            - Repository: ${{ github.repository }}
            - Event: ${{ github.event_name }}
            - Actor: ${{ github.actor }}
            - Issue/PR number: ${{ github.event.issue.number || github.event.pull_request.number }}
            - Issue title: ${{ github.event.issue.title || github.event.pull_request.title }}

            ## Trigger Context
            ${{ github.event_name == 'pull_request_review' && github.event.review.user.login == 'copilot-pull-request-reviewer' && 'Copilot left review comments on this Agent PR. Read ALL review comments from Copilot, address each one with code fixes, commit and push. After pushing, re-request review from Copilot by running: gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers -f "reviewers[]=copilot-pull-request-reviewer"' || '' }}
            ${{ github.event_name == 'pull_request_review' && github.event.review.user.login != 'copilot-pull-request-reviewer' && 'A reviewer requested changes on this PR. Read all review comments and fix them.' || '' }}
            ${{ contains(github.event.comment.body || '', '/claude-fix') && 'Fix all pending review comments on this PR. Read the full review, address each comment, commit fixes, and push.' || '' }}

            ## User Request
            ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}

            ## Instructions
            1. Address the user's request above
            2. Post your response as a comment on the issue/PR using:
               gh issue comment ${{ github.event.issue.number || github.event.pull_request.number }} --body "YOUR RESPONSE"
               or for PRs:
               gh pr comment ${{ github.event.pull_request.number || github.event.issue.number }} --body "YOUR RESPONSE"
            3. Target all PRs to the 'develop' branch
            4. Prefix agent PR titles with '[Agent]'
            5. Do NOT modify submodule source code directly
            6. Do NOT modify project.pbxproj unless absolutely necessary
            7. Keep changes focused — one logical change per PR
            8. When fixing review comments, address ALL comments in a single commit
            9. After fixing, push the changes and comment with a summary of what was fixed
            10. CRITICAL: Never use "Closes #N" or "Fixes #N" for EPIC or parent issues
                in PR bodies or commit messages. Only use "Closes" for the specific
                sub-task issue your PR fully completes. If an issue has sub-tasks or
                is labeled as an epic, reference it with "Part of #N" instead.
                Premature closure of epics destroys tracking.
