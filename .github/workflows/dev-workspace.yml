name: Dev workspace

# Generates Provenance-Dev.xcworkspace with Tuist and builds Provenance-Dev-UI for both
# simulators (ad-hoc signed by Dev/Config/Dev.xcconfig). The fast smoke build for agent PRs
# (replaces Provenance-CI in a follow-up).
on:
  pull_request:
    branches: [develop]
    paths:
      - "Tuist.swift"
      - "Workspace.swift"
      - "Tuist/**"
      - "Dev/**"
      - ".mise.toml"
      - "Build.xcconfig"
      - "Build-iOS.xcconfig"
      - "Provenance/Main UI/**"
      - "Provenance/Provenance-Lite (AppStore)-Info.plist"
      - "PV*/**"
      - "Cores/mGBA/**"
      - "Cores/Stella/**"
      - "Cores/snes9x/**"
      - "Cores/FCEU/**"
      - "Cores/Genesis-Plus-GX/**"
      - "Cores/Mupen64Plus/**"
      - ".github/workflows/dev-workspace.yml"
  push:
    branches: [develop]
  workflow_dispatch:

# PRs: a new push supersedes the old head, so cancel. develop: never cancel a running build, or
# a busy day leaves every commit unbuilt (all eight pushes after #3739 were cancelled, 2026-10-12);
# GitHub still replaces a waiting run with the newest one, so at most one runs and one waits.
concurrency:
  group: dev-workspace-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TUIST_VERSION: "4.200.0"

jobs:
  build:
    name: ${{ matrix.scheme }} (${{ matrix.destination }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scheme: ["Provenance-Dev-UI", "Provenance-Dev-N64", "Provenance-Dev-Coreless"]
        destination: ["generic/platform=iOS Simulator", "generic/platform=tvOS Simulator"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # Same set as agent-validation's smoke build (package resolution needs them), plus the
      # cores Provenance-Dev-UI (mGBA, Stella, snes9x, FCEU, Genesis) and Provenance-Dev-N64
      # (Mupen64Plus + plugins) embed as SwiftPM packages.
      - name: Init required submodules (shallow)
        run: |
          git submodule update --init --depth 1 \
            Cores/4DO \
            Cores/Bliss \
            Cores/CrabEMU \
            Dependencies/HexColors \
            Dependencies/SWCompression \
            Cores/Mednafen/ThirdParty/libchdr \
            PVRcheevos/rcheevos \
            Cores/mGBA/Sources/libmGBA-embed/mgba \
            Cores/Stella/Sources/libstella/stella \
            Cores/snes9x/snes9x-src \
            Cores/snes9x/libretro-snes9x \
            Cores/FCEU/fceux \
            Cores/Genesis-Plus-GX/Sources/libgenesisplus/Genesis-Plus-GX \
            Cores/Mupen64Plus/Sources/Plugins/Core/Core \
            Cores/Mupen64Plus/Sources/Plugins/Video/rice/rice \
            Cores/Mupen64Plus/Sources/Plugins/rsp/hle \
            Cores/Mupen64Plus/Sources/Plugins/rsp/cxd4
          if ! git submodule update --init --depth 1 Dependencies/ZipArchive 2>/dev/null; then
            rm -rf Dependencies/ZipArchive
            git clone --depth 1 https://github.com/ZipArchive/ZipArchive.git Dependencies/ZipArchive
          fi

      - name: Cache libretro cheat database
        uses: actions/cache@v4
        with:
          path: PVLookup/Sources/LibretroCheatDB/Resources/libretro_cheats.sqlite.zip
          key: ${{ runner.os }}-cheatdb-${{ hashFiles('Scripts/generators/generate_cheatdb.py', 'PVLookup/Scripts/generate_cheatdb_if_needed.sh') }}

      - name: Generate libretro cheat database if missing
        run: ./PVLookup/Scripts/generate_cheatdb_if_needed.sh

      - name: Cache slang shader download
        # Scripts/shaders/fetch_slang_shaders.py downloads the pinned library here; unpacking is fast.
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Provenance/slang-shaders/downloads
          key: slang-shaders-${{ hashFiles('Scripts/shaders/slang-shaders.lock.json') }}

      - name: Install Tuist (mise)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install "tuist@${TUIST_VERSION}"
          "$HOME/.local/bin/mise" exec -- tuist version | tee /dev/stderr | grep -qx "${TUIST_VERSION}" \
            || { echo "::error::tuist ${TUIST_VERSION} not installed"; exit 1; }

      - name: Manifest checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: Scripts/dev/check_dev_manifest.sh

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- tuist generate --no-open

      - name: Build
        run: |
          set -o pipefail
          # EXCLUDED_ARCHS=x86_64: Intel is unsupported. It has to be an xcodebuild argument so it
          # reaches the package targets; DevSettings' copy only covers the app target.
          xcodebuild build \
            -workspace Provenance-Dev.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation -skipMacroValidation \
            EXCLUDED_ARCHS=x86_64 \
            2>&1 | tee /tmp/dev-xcodebuild.log | grep -E "(: (fatal )?error:|BUILD (SUCCEEDED|FAILED)|The following build commands failed)" | tail -60

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-xcodebuild-log-${{ strategy.job-index }}
          path: /tmp/dev-xcodebuild.log
          retention-days: 3
