name: Secrets Audit

# GitHub secrets are write-only — the only way to know whether one is EMPTY
# (set with a blank value, or never set) is to ask a runner. This prints
# set/EMPTY per secret without ever echoing a value.
#
#   gh workflow run secrets-audit.yml && gh run watch
#
# Keep the env block in sync with .env.sample / Scripts/secrets-1p.sh.

on:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Report empty secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      CERT_P12: ${{ secrets.CERT_P12 }}
      P12_PASS: ${{ secrets.P12_PASS }}
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
      MOBILEPROVISION: ${{ secrets.MOBILEPROVISION }}
      MOBILEPROVISION_TV: ${{ secrets.MOBILEPROVISION_TV }}
      DYLIBS_TOKEN: ${{ secrets.DYLIBS_TOKEN }}
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
      PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Check each secret is non-empty
        run: |
          empty=0
          check() {
            # Indirect expansion — the value itself is never printed.
            local v="${!1}"
            if [ -n "$v" ]; then
              printf '%-26s set (%s chars)\n' "$1" "${#v}"
            else
              printf '%-26s EMPTY\n' "$1"; empty=$((empty+1))
            fi
          }
          for s in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_CONTENT \
                   CERT_P12 P12_PASS SIGNING_IDENTITY MOBILEPROVISION MOBILEPROVISION_TV \
                   DYLIBS_TOKEN WEBSITE_DISPATCH_TOKEN PAGES_DEPLOY_KEY \
                   DISCORD_WEBHOOK ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN \
                   CURSOR_API_KEY PROJECT_TOKEN KIMI_API_KEY \
                   AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            check "$s"
          done
          echo
          echo "$empty empty secret(s)."
          # Informational only — an empty optional secret shouldn't red-X the run.
