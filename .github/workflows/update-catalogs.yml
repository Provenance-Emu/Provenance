name: Update Skin Catalog & Cheat Database

# Triggers:
#   schedule     — weekly Sunday 4am UTC, keeps DBs current with upstream repos
#   push/develop — re-runs only when the generator scripts themselves change,
#                  so a script fix on develop auto-produces an updated artifact
#   workflow_dispatch — manual run, granular per-job opt-in via inputs
#
# Jobs are independently gated so a skin-only or cheatdb-only push doesn't
# waste runner minutes running the other job.

on:
  schedule:
    - cron: '0 4 * * 0'
  push:
    branches: [develop]
    paths:
      # Cheat DB generator — re-run when the script or system mappings change
      - 'Scripts/generate_cheatdb.py'
      - 'Scripts/systems.py'
      # Skin scraper — re-run when the scraper or its deps change
      - 'Scripts/scrape_skin_catalog.py'
      - 'Scripts/requirements-scraper.txt'
  workflow_dispatch:
    inputs:
      update_skins:
        description: 'Update skin catalog'
        required: false
        default: true
        type: boolean
      update_cheatdb:
        description: 'Update cheat database'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-skin-catalog:
    # Run on: schedule, manual dispatch (with update_skins=true),
    # or push that touched the skin scraper scripts.
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.update_skins == 'true' ||
      (github.event_name == 'push' && (
        contains(github.event.commits[0].modified, 'Scripts/scrape_skin_catalog.py') ||
        contains(github.event.commits[0].modified, 'Scripts/requirements-scraper.txt')
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # Required. `cache: pip` hashes a dependency manifest to build its
          # cache key, and its default glob is `**/requirements.txt` /
          # `**/pyproject.toml` — neither of which matches
          # `requirements-scraper.txt`. Without this the step hard-errors with
          # "No file ... matched to [**/requirements.txt or **/pyproject.toml]"
          # before installing anything, which is what killed every scheduled
          # run of this job since at least 2026-03-08.
          cache-dependency-path: 'Scripts/requirements-scraper.txt'

      - name: Install dependencies
        run: pip install -r Scripts/requirements-scraper.txt

      - name: Run skin catalog scraper
        run: |
          python3 Scripts/scrape_skin_catalog.py \
            --output Scripts/catalog_seed.json \
            --skip-validation
          # Also update the bundled copy in PVUI
          cp Scripts/catalog_seed.json PVUI/Sources/PVUIBase/Resources/catalog_seed.json

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet Scripts/catalog_seed.json PVUI/Sources/PVUIBase/Resources/catalog_seed.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update skin catalog seed data'
          title: '[Auto] Update skin catalog seed data'
          body: |
            Automated update of the skin catalog seed data from community skin sources.

            Generated by `Scripts/scrape_skin_catalog.py`.
          branch: auto/update-skin-catalog
          base: develop
          labels: enhancement

  update-cheatdb:
    # Run on: schedule, manual dispatch (with update_cheatdb=true),
    # or push that touched the cheat DB generator script.
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.update_cheatdb == 'true' ||
      (github.event_name == 'push' && (
        contains(github.event.commits[0].modified, 'Scripts/generate_cheatdb.py') ||
        contains(github.event.commits[0].modified, 'Scripts/systems.py')
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone libretro-database (shallow)
        run: git clone --depth=1 https://github.com/libretro/libretro-database.git /tmp/libretro-database

      - name: Generate cheat database
        run: |
          python3 Scripts/generate_cheatdb.py /tmp/libretro-database/cht/ \
            --dat-dir /tmp/libretro-database \
            --output PVLookup/Sources/LibretroCheatDB/Resources/libretro_cheats.sqlite

      - name: Cleanup
        run: rm -rf /tmp/libretro-database

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet PVLookup/Sources/LibretroCheatDB/Resources/libretro_cheats.sqlite \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update libretro cheat database'
          title: '[Auto] Update libretro cheat database'
          body: |
            Automated update of the libretro cheat database from upstream libretro-database.

            Generated by `Scripts/generate_cheatdb.py`.
          branch: auto/update-cheatdb
          base: develop
          labels: cheats
