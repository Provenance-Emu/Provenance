name: Update Skin Catalog & Cheat Database

on:
  schedule:
    # Run weekly on Sundays at 4am UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      update_skins:
        description: 'Update skin catalog'
        required: false
        default: true
        type: boolean
      update_cheatdb:
        description: 'Update cheat database'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-skin-catalog:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.update_skins == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r Scripts/requirements-scraper.txt

      - name: Run skin catalog scraper
        run: |
          python3 Scripts/scrape_skin_catalog.py \
            --output Scripts/catalog_seed.json \
            --skip-validation
          # Also update the bundled copy in PVUI
          cp Scripts/catalog_seed.json PVUI/Sources/PVUIBase/Resources/catalog_seed.json

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet Scripts/catalog_seed.json PVUI/Sources/PVUIBase/Resources/catalog_seed.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update skin catalog seed data'
          title: '[Auto] Update skin catalog seed data'
          body: |
            Automated update of the skin catalog seed data from community skin sources.

            Generated by `Scripts/scrape_skin_catalog.py`.
          branch: auto/update-skin-catalog
          base: develop
          labels: enhancement

  update-cheatdb:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.update_cheatdb == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone libretro-database (shallow)
        run: git clone --depth=1 https://github.com/libretro/libretro-database.git /tmp/libretro-database

      - name: Generate cheat database
        run: |
          python3 Scripts/generate_cheatdb.py /tmp/libretro-database/cht/ \
            --dat-dir /tmp/libretro-database \
            --output PVLookup/Sources/LibretroCheatDB/Resources/libretro_cheats.sqlite

      - name: Cleanup
        run: rm -rf /tmp/libretro-database

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet PVLookup/Sources/LibretroCheatDB/Resources/libretro_cheats.sqlite && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update libretro cheat database'
          title: '[Auto] Update libretro cheat database'
          body: |
            Automated update of the libretro cheat database from upstream libretro-database.

            Generated by `Scripts/generate_cheatdb.py`.
          branch: auto/update-cheatdb
          base: develop
          labels: cheats
