name: Bump Version

# Increment version and/or build number in Build.xcconfig.
# Creates a PR or commits directly to develop.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'What to bump'
        required: true
        default: 'build'
        type: choice
        options: [build, minor, major]
      marketing_version:
        description: 'Override marketing version (e.g. 3.4.0) — leave blank to auto-bump'
        required: false
        type: string
      create_pr:
        description: 'Create a PR instead of committing directly to develop'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump ${{ github.event.inputs.bump_type }} version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Read current versions
        id: current
        run: |
          MARKETING=$(grep -E '^MARKETING_VERSION\s*=' Build.xcconfig | sed 's/.*=\s*//' | tr -d '[:space:]')
          BUILD=$(grep -E '^CURRENT_PROJECT_VERSION\s*=' Build.xcconfig | sed 's/.*=\s*//' | tr -d '[:space:]')
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"         >> "$GITHUB_OUTPUT"
          echo "Current: v$MARKETING (build $BUILD)"

      - name: Calculate new versions
        id: new
        run: |
          CURRENT_MARKETING="${{ steps.current.outputs.marketing }}"
          CURRENT_BUILD="${{ steps.current.outputs.build }}"
          BUMP="${{ github.event.inputs.bump_type }}"
          OVERRIDE="${{ github.event.inputs.marketing_version }}"

          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT_MARKETING"
          NEW_BUILD=$(( CURRENT_BUILD + 1 ))

          if [[ -n "$OVERRIDE" ]]; then
            NEW_MARKETING="$OVERRIDE"
          elif [[ "$BUMP" == "major" ]]; then
            NEW_MARKETING="$(( MAJ + 1 )).0.0"
          elif [[ "$BUMP" == "minor" ]]; then
            NEW_MARKETING="${MAJ}.$(( MIN + 1 )).0"
          else
            NEW_MARKETING="$CURRENT_MARKETING"
          fi

          echo "marketing=$NEW_MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$NEW_BUILD"         >> "$GITHUB_OUTPUT"
          echo "New: v$NEW_MARKETING (build $NEW_BUILD)"

      - name: Update Build.xcconfig
        run: |
          NEW_MARKETING="${{ steps.new.outputs.marketing }}"
          NEW_BUILD="${{ steps.new.outputs.build }}"

          sed -i "s/^MARKETING_VERSION\s*=.*/MARKETING_VERSION = $NEW_MARKETING/" Build.xcconfig
          sed -i "s/^CURRENT_PROJECT_VERSION\s*=.*/CURRENT_PROJECT_VERSION = $NEW_BUILD/" Build.xcconfig

          echo "Updated Build.xcconfig:"
          grep -E '^(MARKETING_VERSION|CURRENT_PROJECT_VERSION)' Build.xcconfig

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet Build.xcconfig; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version change needed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and create PR
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.create_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_M="${{ steps.current.outputs.marketing }}"
          OLD_B="${{ steps.current.outputs.build }}"
          NEW_M="${{ steps.new.outputs.marketing }}"
          NEW_B="${{ steps.new.outputs.build }}"

          BRANCH="release/bump-version-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add Build.xcconfig
          git commit -m "chore: bump version to $NEW_M (build $NEW_B)

Version: $OLD_M → $NEW_M
Build: $OLD_B → $NEW_B

Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin "$BRANCH"

          gh pr create \
            --title "chore: bump version to $NEW_M (build $NEW_B)" \
            --body "## Version Bump

| Field | Before | After |
|-------|--------|-------|
| Marketing Version | $OLD_M | $NEW_M |
| Build Number | $OLD_B | $NEW_B |

Auto-generated by [bump-version.yml](../actions/workflows/bump-version.yml)." \
            --base develop \
            --head "$BRANCH" \
            --label "chore"

      - name: Commit directly to develop
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.create_pr != 'true'
        run: |
          NEW_M="${{ steps.new.outputs.marketing }}"
          NEW_B="${{ steps.new.outputs.build }}"
          git add Build.xcconfig
          git commit -m "chore: bump version to $NEW_M (build $NEW_B)

Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin develop
          echo "Pushed directly to develop"

      - name: Summary
        run: |
          echo "### Version Bump" >> "$GITHUB_STEP_SUMMARY"
          echo "| | Before | After |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Marketing | ${{ steps.current.outputs.marketing }} | ${{ steps.new.outputs.marketing }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ steps.current.outputs.build }} | ${{ steps.new.outputs.build }} |" >> "$GITHUB_STEP_SUMMARY"
