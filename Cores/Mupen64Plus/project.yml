          - "cicx105.c"
          - "hle.c"
          - "hvqm.c"
          - "jpeg.c"
          - "memory.c"
          - "mp3.c"
          - "musyx.c"
          - "osal_dynamiclib_unix.c"
          - "plugin.c"
          - "re2.c"
    settings:
      base:
        PRODUCT_NAME: PVMupen64PlusRspHLE
        DEFINES_MODULE: YES
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Sources/Plugins/rsp/hle/src/"
          - "Sources/Plugins/Core/Core/src/api"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"

  # ===========================================================================
  # SDL — Stub SDL compatibility layer
  # ===========================================================================
  SDL:
    type: framework
    platform: [iOS, tvOS]
    sources:
      - path: Sources/Compatibility/SDL
        includes:
          - "SDLStubs.m"
    settings:
      base:
        PRODUCT_NAME: SDL
        DEFINES_MODULE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Sources/Compatibility/SDL/"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"

  # ===========================================================================
  # libpng — PNG library (bundled)
  # ===========================================================================
  libpng:
    type: library.static
    platform: [iOS, tvOS]
    dependencies:
      - sdk: libz.tbd
    sources:
