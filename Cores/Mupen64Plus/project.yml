##
## project.yml — XcodeGen spec for PVMupen64Plus
##
## Usage:
##   xcodegen generate --spec project.yml
##
## This file mirrors the structure defined in Package.swift so that both
## SPM (swift build) and Xcode (via XcodeGen) build paths are supported.
##
## Regenerate the .xcodeproj at any time with:
##   cd Cores/Mupen64Plus && xcodegen generate
##

name: PVMupen64Plus

options:
  bundleIdPrefix: org.provenance-emu
  createIntermediateGroups: true
  defaultConfig: Release
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  minimumXcodeGenVersion: "2.36"
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

# ─── Shared preprocessor defines ─────────────────────────────────────────────
# These are common across all C/ObjC targets and mirror sharedCSettings in
# Package.swift.

settings:
  base:
    ALLOW_TARGET_PLATFORM_SPECIALIZATION: YES
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator appletvos appletvsimulator"
    SWIFT_VERSION: "6.0"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++11"
    GCC_C_LANGUAGE_STANDARD: "gnu99"
    # Common preprocessor defines (all platforms)
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
      - "__unix__=1"
      - "GCC=1"
      - "GLES_SILENCE_DEPRECATION=1"
      - "GL_SILENCE_DEPRECATION=1"
      - "M64P_PLUGIN_PROTOTYPES=1"
      - "MUPENPLUSAPI=1"
      - "M64P_PLUGIN_API=1"
      - "IN_OPENEMU=1"
      - "PIC=1"
      - "M64P_PARALLEL=1"
      - "NO_ASM=1"
      - "PROVENANCE=1"
      - "TXFILTER_LIB=1"
      - "VFP_HARD=1"
    # iOS/tvOS-specific defines (GLES, NEON, etc.) — mirrors sharedCSettings .when(platforms:) in Package.swift
    "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphoneos*]":
      - "$(inherited)"
      - "GLESX=1"
      - "NEON=1"
      - "OS_IOS=1"
      - "__VEC4_OPT=1"
      - "__NEON_OPT=1"
      - "SDL_VIDEO_OPENGL_ES2=1"
      - "USE_GLES=1"
      - "USE_GLES2=1"
      - "USE_GLES3=1"
      - "USE_GLES3_2=1"
      - "USE_GLES_ES2=1"
      - "USE_GLES_ES3=1"
      - "USE_GLES_ES3_2=1"
    "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphonesimulator*]":
      - "$(inherited)"
      - "GLESX=1"
      - "NEON=1"
      - "OS_IOS=1"
      - "__VEC4_OPT=1"
      - "__NEON_OPT=1"
      - "SDL_VIDEO_OPENGL_ES2=1"
      - "USE_GLES=1"
      - "USE_GLES2=1"
      - "USE_GLES3=1"
      - "USE_GLES3_2=1"
      - "USE_GLES_ES2=1"
      - "USE_GLES_ES3=1"
      - "USE_GLES_ES3_2=1"
    "GCC_PREPROCESSOR_DEFINITIONS[sdk=appletvos*]":
      - "$(inherited)"
      - "GLESX=1"
      - "NEON=1"
      - "OS_IOS=1"
      - "__VEC4_OPT=1"
      - "__NEON_OPT=1"
      - "SDL_VIDEO_OPENGL_ES2=1"
      - "USE_GLES=1"
      - "USE_GLES2=1"
      - "USE_GLES3=1"
      - "USE_GLES3_2=1"
      - "USE_GLES_ES2=1"
      - "USE_GLES_ES3=1"
      - "USE_GLES_ES3_2=1"
    "GCC_PREPROCESSOR_DEFINITIONS[sdk=appletvsimulator*]":
      - "$(inherited)"
      - "GLESX=1"
      - "NEON=1"
      - "OS_IOS=1"
      - "__VEC4_OPT=1"
      - "__NEON_OPT=1"
      - "SDL_VIDEO_OPENGL_ES2=1"
      - "USE_GLES=1"
      - "USE_GLES2=1"
      - "USE_GLES3=1"
      - "USE_GLES3_2=1"
      - "USE_GLES_ES2=1"
      - "USE_GLES_ES3=1"
      - "USE_GLES_ES3_2=1"
    # Compose OTHER_CFLAGS from helper settings so arch-tuning and SDK defines
    # are both applied. Xcode resolves a single conditionalized value per build
    # dimension, so split them into M64_ARCH_CFLAGS + M64_SDK_CFLAGS and
    # reference both from the unconditional OTHER_CFLAGS entry.
    OTHER_CFLAGS: "$(inherited) -fno-strict-aliasing -fvisibility=hidden -fomit-frame-pointer -fvisibility-inlines-hidden -fPIC -pthread $(M64_ARCH_CFLAGS) $(M64_SDK_CFLAGS)"
    # ARMv8 / Apple CPU tuning helper — applied only on arm64 slices
    M64_ARCH_CFLAGS: ""
    "M64_ARCH_CFLAGS[arch=arm64]": "-march=armv8-a+simd+crc+crypto -mcpu=apple-a10 -mtune=apple-a15"
    "M64_ARCH_CFLAGS[arch=x86_64]": ""
    # SDK-specific C defines helper (mirrors Config.xcconfig)
    M64_SDK_CFLAGS: ""
    "M64_SDK_CFLAGS[sdk=iphoneos*]": "-DOS_IOS -D__VEC4_OPT -D__NEON_OPT"
    "M64_SDK_CFLAGS[sdk=iphonesimulator*]": "-DOS_IOS"
    "M64_SDK_CFLAGS[sdk=appletvos*]": "-DOS_IOS -D__VEC4_OPT -D__NEON_OPT"
    "M64_SDK_CFLAGS[sdk=appletvsimulator*]": "-DOS_IOS"
    # macOS preprocessor defines (mirrors Config.xcconfig)
    "GCC_PREPROCESSOR_DEFINITIONS[sdk=macosx*]":
      - "$(inherited)"
      - "OS_MAC_OS_X=1"
      - "SDL_VIDEO_OPENGL=1"
    # Exclude non-NEON sources on tvOS device (mirrors Config.xcconfig)
    "EXCLUDED_SOURCE_FILE_NAMES[sdk=appletvos*]": "$(inherited) 3DMath.cpp RSP_LoadMatrix.cpp CRC_OPT.cpp"
    # tvOS Simulator: mirror Config.xcconfig — compile only the PVDebug.c stub.
    # Config.xcconfig uses:
    #   EXCLUDED_SOURCE_FILE_NAMES[sdk=appletvsimulator*][arch=*] = *
    #   INCLUDED_SOURCE_FILE_NAMES[sdk=appletvsimulator*][arch=*] = PVDebug.c
    "EXCLUDED_SOURCE_FILE_NAMES[sdk=appletvsimulator*][arch=*]": "$(inherited) *"
    "INCLUDED_SOURCE_FILE_NAMES[sdk=appletvsimulator*][arch=*]": "$(inherited) PVDebug.c"
    HEADER_SEARCH_PATHS: "$(inherited)"
    FRAMEWORK_SEARCH_PATHS: "$(inherited)"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited)"
    # Suppress Xcode validation warnings for deprecated-but-required OpenGLES.framework
    # (mirrors VALIDATE_WORKSPACE_SKIPPED_SDK_FRAMEWORKS in the hand-maintained .xcodeproj)
    VALIDATE_WORKSPACE_SKIPPED_SDK_FRAMEWORKS: OpenGLES
  configs:
    Debug:
      COPY_PHASE_STRIP: NO
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      COPY_PHASE_STRIP: YES
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      MTL_ENABLE_DEBUG_INFO: NO

# ─── External Swift Packages ──────────────────────────────────────────────────
# Local PV* packages referenced by PVMupen and PVMupen64PlusBridge — mirrors
# the `dependencies:` entries in Package.swift.

packages:
  PVAudio:
    path: ../../PVAudio
  PVCoreBridge:
    path: ../../PVCoreBridge
  PVCoreObjCBridge:
    path: ../../PVCoreObjCBridge
  PVEmulatorCore:
    path: ../../PVEmulatorCore
  PVLogging:
    path: ../../PVLogging
  PVNetplay:
    path: ../../PVNetplay
  PVObjCUtils:
    path: ../../PVObjCUtils
  PVPlists:
    path: ../../PVPlists
  PVSettings:
    path: ../../PVSettings
  PVSupport:
    path: ../../PVSupport

# ─── Targets ─────────────────────────────────────────────────────────────────

targets:

  # ===========================================================================
  # PVMupen — Main Swift product target
  # ===========================================================================
  PVMupen:
    type: framework
    platform: [iOS, tvOS]
    sources:
      - path: Sources/PVMupen
    resources:
      - path: Sources/PVMupen/Resources/Core.plist
    dependencies:
      - target: PVMupen64PlusBridge
      - target: PVMupen64PlusCore
      - target: PVRSPCXD4
      - package: PVAudio
        product: PVAudio
      - package: PVCoreBridge
        product: PVCoreBridge
      - package: PVCoreObjCBridge
        product: PVCoreObjCBridge
      - package: PVEmulatorCore
        product: PVEmulatorCore
      - package: PVLogging
        product: PVLogging
      - package: PVPlists
        product: PVPlists
      - package: PVSettings
        product: PVSettings
      - package: PVNetplay
        product: PVNetplay
      - package: PVSupport
        product: PVSupport
    settings:
      base:
        PRODUCT_NAME: PVMupen
        INFOPLIST_FILE: PVMupen64Plus-Info.plist
        SWIFT_VERSION: "6.0"
        DEFINES_MODULE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS:
          - "$(inherited)"
          - "GLES_SILENCE_DEPRECATION"
          - "GL_SILENCE_DEPRECATION"
          - "M64P_PLUGIN_PROTOTYPES"
          - "MUPENPLUSAPI"
          - "NO_ASM"
          - "PROVENANCE"
          - "TXFILTER_LIB"
          - "USE_GLES"
          - "VFP_HARD"
          - "__unix__"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Sources/Plugins/Core/Core/src/"

  # ===========================================================================
  # PVMupen64PlusBridge — ObjC bridge layer
  # ===========================================================================
  PVMupen64PlusBridge:
    type: framework
    platform: [iOS, tvOS]
    sources:
      - path: Sources/PVMupenBridge
        excludes: []
    dependencies:
      - target: PVMupen64PlusCore
      - target: SDL
      - package: PVAudio
        product: PVAudio
      - package: PVCoreBridge
        product: PVCoreBridge
      - package: PVCoreObjCBridge
        product: PVCoreObjCBridge
      - package: PVEmulatorCore
        product: PVEmulatorCore
      - package: PVLogging
        product: PVLogging
      - package: PVLogging
        product: PVLoggingObjC
      - package: PVObjCUtils
        product: PVObjCUtils
      - package: PVPlists
        product: PVPlists
      - package: PVSettings
        product: PVSettings
      - package: PVSupport
        product: PVSupport
    settings:
      base:
        PRODUCT_NAME: PVMupen64PlusBridge
        PRODUCT_MODULE_NAME: PVMupen64PlusBridge
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Sources/Plugins/Core/Core/src/"
          - "Sources/Plugins/Core/Core/src/api"
          - "Sources/Compatibility/SDL/"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"

  # ===========================================================================
  # PVMupen64PlusCore — Core emulator library (libmupen64plus)
  # ===========================================================================
  PVMupen64PlusCore:
    type: framework
    platform: [iOS, tvOS]
    sources:
      - path: Sources/Plugins/Core/Core/src
        # Only the explicit sources from Package.swift
        includes:
          - "api/callbacks.c"
          - "api/common.c"
          - "api/config.c"
          - "api/debugger.c"
          - "api/frontend.c"
          - "asm_defines/asm_defines.c"
          - "backends/clock_ctime_plus_delta.c"
          - "backends/file_storage.c"
          - "backends/plugins_compat/audio_plugin_compat.c"
          - "backends/plugins_compat/input_plugin_compat.c"
          - "device/cart/af_rtc.c"
          - "device/cart/cart.c"
          - "device/cart/cart_rom.c"
          - "device/cart/eeprom.c"
          - "device/cart/flashram.c"
          - "device/cart/sram.c"
          - "device/controllers/game_controller.c"
          - "device/controllers/paks/mempak.c"
          - "device/controllers/paks/rumblepak.c"
          - "device/controllers/paks/transferpak.c"
          - "device/device.c"
          - "device/gb/gb_cart.c"
          - "device/gb/m64282fp.c"
          - "device/gb/mbc3_rtc.c"
          - "device/memory/memory.c"
          - "device/pif/bootrom_hle.c"
          - "device/pif/cic.c"
          - "device/pif/n64_cic_nus_6105.c"
          - "device/pif/pif.c"
          - "device/r4300/cached_interp.c"
          - "device/r4300/cp0.c"
          - "device/r4300/cp1.c"
          - "device/r4300/idec.c"
          - "device/r4300/interrupt.c"
          - "device/r4300/pure_interp.c"
          - "device/r4300/r4300_core.c"
          - "device/r4300/tlb.c"
          - "device/rcp/ai/ai_controller.c"
          - "device/rcp/mi/mi_controller.c"
          - "device/rcp/pi/pi_controller.c"
          - "device/rcp/rdp/fb.c"
          - "device/rcp/rdp/rdp_core.c"
          - "device/rcp/ri/ri_controller.c"
          - "device/rcp/rsp/rsp_core.c"
          - "device/rcp/si/si_controller.c"
          - "device/rcp/vi/vi_controller.c"
          - "device/rdram/rdram.c"
          - "main/cheat.c"
          - "main/lirc.c"
          - "main/md5.c"
          - "main/rom.c"
          - "main/savestates.c"
          - "main/sdl_key_converter.c"
          - "main/util.c"
          - "main/workqueue.c"
          - "main/xxHash/xxhash.c"
          - "main/zip/ioapi.c"
          - "main/zip/unzip.c"
          - "main/zip/zip.c"
          - "osal/dynamiclib_unix.c"
          - "osal/files_macos.c"
          - "plugin/dummy_audio.c"
          - "plugin/dummy_input.c"
          - "plugin/dummy_rsp.c"
          - "plugin/dummy_video.c"
          - "plugin/plugin.c"
    dependencies:
      - target: SDL
    settings:
      base:
        PRODUCT_NAME: PVMupen64PlusCore
        DEFINES_MODULE: YES
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Sources/Plugins/Core/Core/src/"
          - "Sources/Compatibility/SDL/"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"

  # ===========================================================================
  # PVRSPCXD4 — CXD4 RSP plugin
  # ===========================================================================
  PVRSPCXD4:
    type: framework
    platform: [iOS, tvOS]
    sources:
      - path: Sources/Plugins/rsp/cxd4
        includes:
          - "module.c"
          - "osal_dynamiclib_unix.c"
          - "su.c"
          - "vu/add.c"
          - "vu/divide.c"
          - "vu/logical.c"
          - "vu/multiply.c"
          - "vu/select.c"
          - "vu/vu.c"
    settings:
      base:
        PRODUCT_NAME: PVRSPCXD4
        DEFINES_MODULE: YES
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "Sources/Plugins/rsp/cxd4/"
          - "Sources/Plugins/Core/Core/src/api"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "HAVE_STANDARD_INTEGER_TYPES=1"
          - "M64P_PLUGIN_API=1"

  # ===========================================================================
  # PVMupen64PlusRspHLE — HLE RSP plugin
  # ===========================================================================
  PVMupen64PlusRspHLE:
    type: framework
    platform: [iOS, tvOS]
    sources:
