# cores.yml — Single source of truth for libretro core management
#
# This file replaces 4 manually-maintained url list files:
#   urls.txt, urls-appstore.txt, urls-tv.txt, urls-appstore-tv.txt
# and their corresponding xcfilelist files.
#
# Run `python3 Scripts/generate_core_lists.py generate` to regenerate all files.
#
# PVCoreIdentifier mapping (must match PVRetroArch/Core.plist PVCores entries):
#   YAML `name` uses underscores; the bundled framework id uses dots, e.g.
#   mednafen_psx -> mednafen.psx.libretro.framework
# Cores not listed in Core.plist, or listed with PVDisabled (no importer support),
# should use enabled: false so buildbot dylibs are not pulled into generated lists.
#
# Fields per core entry:
#   name      - core name (used to derive filenames)
#   ios       - included in iOS builds
#   tvos      - included in tvOS builds
#   appstore  - allowed in App Store builds (false = excluded from appstore variants).
#               Keep in sync with PVAppStoreDisabled on each core dict in PVRetroArch/Core.plist.
#   enabled   - if false, written as a commented line (#url or #path) in ALL generated
#               files — both url lists and xcfilelists use the same convention
#   filename  - ONLY set for platform-neutral filenames (no _ios/_tvos suffix)
#               e.g., "flycast_libretro.dylib"
#               Omit for standard platform-suffixed cores.
#   local     - if true, dylib is built locally (not downloaded from buildbot).
#               The core is commented out in URL lists so it won't be downloaded,
#               and get-modules.sh / make_frameworks will never delete or overwrite it.
#               You must manually place the dylib in modules/ yourself.
#   appstore_excluded_reason - optional human-readable reason for appstore: false
#
buildbot:
  base_url: "https://buildbot.libretro.com/nightly/apple"
  ios_path: "ios-arm64/latest"
  tvos_path: "tvos-arm64/latest"
  # pinned_date: pins all dylib downloads to a specific buildbot nightly date (YYYY-MM-DD).
  # When set, the fetch script replaces "latest" in URLs with this date for reproducible builds.
  # Update via: CoresRetro/RetroArch/scripts/update-dylib-pins.sh [YYYY-MM-DD]
  # pinned_date: disabled — libretro buildbot doesn't archive dated snapshots
  # for apple/ios-arm64 or tvos-arm64; only "latest" has actual files.
  # pinned_date: "2026-03-18"

cores:
  # Order: plist-registered cores first (enabled), then not-in-plist (disabled).

  # --- Listed in PVRetroArch/Core.plist (RetroArch meta core) ---

  - name: snes9x
    # Super Nintendo (canonical Snes9x) — must stay enabled if listed in Core.plist
    ios: true
    tvos: true
    appstore: true
    enabled: true

  # App Store exclusions — present in sideload builds, commented in appstore builds
  - name: dolphin
    # GameCube / Wii
    ios: true
    tvos: true
    appstore: false
    enabled: true
    filename: "dolphin_libretro.dylib"
    appstore_excluded_reason: "Contains JIT/dynamic recompilation not permitted in App Store"

  - name: vitaquake2
    # Quake II (Vita port)
    ios: true
    tvos: true
    appstore: false
    enabled: false
    appstore_excluded_reason: "PVAppStoreDisabled — asset/setup differs from typical ROM cores; App Store build omits dylib"

