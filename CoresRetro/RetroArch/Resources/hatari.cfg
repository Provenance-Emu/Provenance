[Floppy]
bAutoInsertDiskB = TRUE
FastFloppy = TRUE
nWriteProtection = 0
szDiskAFileName =
szDiskBFileName =
szDiskImageDirectory = ~/Documents/ROMs/com.provenance.atarist/
szDiskAZipPath =
szDiskBZipPath =

[ROM]
szCartridgeImageFileName =
szTosImageFileName = tos.img

[Log]
sLogFileName = stderr
sTraceFileName = stderr
nExceptionDebugMask = 259
nTextLogLevel = 4
; Suppress alert dialogs — the hatari libretro core calls input_gui() for
; dialog input, but RetroArch input callbacks are not yet set during
; retro_load_game(), causing a NULL pointer crash (EXC_BAD_ACCESS).
nAlertDlgLogLevel = 0
bConfirmQuit = FALSE
bNatFeats = FALSE
bConsoleWindow = FALSE

[System]
nCpuLevel = 2
nCpuFreq = 8
bCompatibleCpu = FALSE
; Machine types: 0=ST, 1=STE, 2=TT, 3=Falcon, 4=MegaST, 5=MegaSTE
nMachineType = 0
bBlitter = TRUE
nDSPType = 0
bRealTimeClock = FALSE
bPatchTimerD = TRUE
bFastBoot = FALSE
bFastForward = FALSE

[Screen]
bFullScreen = FALSE
nFrameSkips = 0
bShowStatusbar = FALSE
bShowDriveLed = FALSE
; nMonitorType: 0=Color ST (correct for most games), 1=Mono SM124, 2=VGA, 3=TV
nMonitorType = 0
bOverscan = FALSE
; nSpec512Threshold: 4 is recommended (avoids false Spectrum 512 dithering detection)
nSpec512Threshold = 4
bForceMax = FALSE
; ST low-res is 320x200; allow up to 832x576 for libretro rendering headroom
nMaxWidth = 832
nMaxHeight = 576
bAspectRatio = TRUE
bAspectCorrect = TRUE
bUseExtVdiResolutions = FALSE
bAllowOverscan = FALSE
nVdiColors = 16
nVdiWidth = 640
nVdiHeight = 480
nVdiPlanes = 4

[Video]
bUseExtVdiResolutions = FALSE
nVdiColors = 16
nVdiWidth = 640
nVdiHeight = 480
nVdiPlanes = 4

; Explicitly disable hard disk boot and ACSI to prevent the hatari libretro
; core from passing --acsi "" when no HD image is configured.
; bUseHardDiskImage maps to Acsi[0].bUseDevice; szHardDiskImage maps to
; Acsi[0].sDeviceFile.  Both must be clear to prevent the --acsi "" crash.
[HardDisk]
bBootFromHardDisk = FALSE
bUseHardDiskDirectory = FALSE
bUseHardDiskDirectories = FALSE
bUseHardDiskImage = FALSE
nHardDiskDrive = 0
szHardDiskDirectory =
szHardDiskImage =

[ACSI]
; Disable all ACSI slots.  Slot 0 is also covered by szHardDiskImage above.
; Both bUseDeviceN (old style) and nDeviceType_N (new style) are set for
; maximum compatibility across Hatari builds.
